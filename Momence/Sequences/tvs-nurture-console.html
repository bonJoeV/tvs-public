fill="#013160">books</text><line x1="335" y1="172" x2="335" y2="248" stroke="#013160" stroke-width="1" marker-end="url(#tvsarrow)"/><text x="343" y="214" text-anchor="start" class="svgs" fill="#013160">visit 1</text><polyline points="250,160 230,160 230,376 248,376" fill="none" stroke="#013160" stroke-width="1" marker-end="url(#tvsarrow)"/><text x="238" y="332" text-anchor="start" class="svgs" fill="#013160">no-show</text><line x1="422" y1="276" x2="457" y2="276" stroke="#013160" stroke-width="1" marker-end="url(#tvsarrow)"/><text x="439" y="266" text-anchor="middle" class="svgs" fill="#013160">visit 2</text><line x1="545" y1="302" x2="545" y2="348" stroke="#013160" stroke-width="1" marker-end="url(#tvsarrow)"/><text x="553" y="332" text-anchor="start" class="svgs" fill="#013160">converts</text><line x1="545" y1="402" x2="545" y2="448" stroke="#013160" stroke-width="1" marker-end="url(#tvsarrow)"/><text x="553" y="432" text-anchor="start" class="svgs" fill="#013160">quiet 14d</text><text x="30" y="628" class="svgs" fill="#013160">Studio-specific sources set Intro Nurture. Generic sources set TC - Unassigned.</text><text x="30" y="646" class="svgs" fill="#013160">Dead ends set Long Term, draining to 20. Not drawn: 82 freeze and 84 expiration, which behave exactly like 80.</text></svg>'+ 
      '</section>'+

      '<section class="panel"><h2>Build settings</h2>'+
      '<p>Every sequence uses the same New sequence form. Four fields on it matter: the name, the trigger, the enrollment toggle, and the counter conditions. Here is exactly what to type in each, per sequence. Replace <code>##</code> with the studio code: Mtka, Slp, Ep or Sav.</p>'+
      '<table class="grid"><thead><tr><th>Sequence name</th><th>Trigger</th><th>Once</th><th>Counter conditions (any one removes them)</th></tr></thead><tbody>'+
      '<tr><td><code>##</code>-10 Lead nurture</td><td>Lead assigned new stage</td><td>Yes</td><td>Appointment purchase, Appointment booking, Membership purchase, <b>all-time</b></td></tr>'+
      '<tr><td><code>##</code>-20 Long-term nurture</td><td>Lead assigned new stage</td><td>Yes</td><td>same three, <b>after enrollment</b></td></tr>'+
      '<tr><td><code>##</code>-30 Pre-visit reminders</td><td>Appointment visit, every visit, On booking</td><td><b>No</b></td><td>Appointment cancellation</td></tr>'+ 
      '<tr><td><code>##</code>-31 Intro booking email</td><td>Appointment visit, visit 1, On booking</td><td>Yes</td><td>none</td></tr>'+ 
      '<tr><td><code>##</code>-40 No-show rescue</td><td>Lead assigned new stage</td><td>Yes</td><td>Appointment booking, Appointment purchase, Membership purchase, <b>after enrollment</b></td></tr>'+
      '<tr><td><code>##</code>-50 Intro visits</td><td>Appointment visit, visit 1, On check-in</td><td>Yes</td><td><b>none</b>, a gate handles the nudge</td></tr>'+
      '<tr><td><code>##</code>-60 The ask</td><td>Appointment visit, visit 2, On check-in</td><td>Yes</td><td>Membership purchase, Appointment booking, <b>after enrollment</b></td></tr>'+
      '<tr><td><code>##</code>-65 New member welcome</td><td>Membership purchase</td><td>Yes</td><td>none available</td></tr>'+
      '<tr><td><code>##</code>-70 Winback</td><td>Win-back, active-membership gates at 14 and 28 days</td><td>Yes</td><td>Appointment booking, Membership purchase, <b>after enrollment</b></td></tr>'+
      '<tr><td><code>##</code>-80 Save the member</td><td>Subscription cancellation</td><td>Yes</td><td>Membership purchase, <b>after enrollment</b></td></tr>'+
      '<tr><td><code>##</code>-82 Freeze save</td><td>Membership freeze</td><td>Yes</td><td>Membership purchase, Appointment booking, <b>after enrollment</b></td></tr>'+
      '<tr><td><code>##</code>-84 Expiration win-back</td><td>Membership expiration</td><td>Yes</td><td>Membership purchase, Appointment booking, <b>after enrollment</b></td></tr></tbody></table>'+
      '<p class="flag"><b>All-time versus after enrollment is the setting that decides whether half this build works.</b> Every counter condition has a timeframe toggle. Among the per-studio sequences, <b>only <code>##</code>-10 uses all-time</b>, because a brand-new lead has no history. The two shared lead flows also use all-time for the same reason. Every sequence targeting somebody with a prior booking, purchase or membership uses after enrollment. Set those to all-time and Momence enrolls them and ejects them in the same instant.</p>'+ 
      '<p class="flag"><b>The counter-condition names above are exact.</b> The Type dropdown offers Class purchase, Membership purchase, Appointment purchase, Appointment booking, and Customer has tag. We never use Class purchase, since we sell appointments, not classes. Leave the "Optional: associate with specific" field <b>blank</b> on every one: an empty association means any appointment or any membership counts, which is what we want. Filling it scopes the condition to a single class or service and will silently fail to catch conversions.</p>'+
      '<p class="flag"><b>A counter condition is an exit, not a gate.</b> It removes the person from the sequence; it does not skip one step and resume. So nothing that should happen <em>after</em> a conversion can live in a sequence that counters on conversion. That is why the welcome and the review ask are in <code>##</code>-65 with their own trigger rather than at the end of <code>##</code>-60, where they could never have fired. Use a true/false condition when you want a fork; use a counter when you want someone gone.</p>'+
      '<p class="flag"><b>The visit-number trap.</b> 31, 50 and 60 use the Appointment visit trigger with a specific visit number. Sequence 31 is visit 1 enrolled On booking. Sequences 50 and 60 are enrolled On check-in and use visit 1 and visit 2 respectively. Set both the number and booking/check-in choice correctly, or the intro email and follow-up actions fire at the wrong point.</p>'+ 
      '<p><b>Trigger notes.</b> 10, 20 and 40 all trigger on "Lead assigned new stage" and are told apart by the stage value: Intro Nurture for 10, Long Term for 20, No Show for 40. Sequence 31 uses Appointment visit, visit 1, On booking. Sequences 50 and 60 use Appointment visit enrolled On check-in, separated by visit number 1 and 2. Sequence 65 is the only sequence triggered by a purchase.</p>'+ 
      '<p class="flag"><b>No-show rescue needs its own sequence, and this is why.</b> The tempting shortcut is to have front desk reset a missed lead back to the Intro Nurture stage so 10 fires again with a rescue text at the top. It cannot work. 10 is enrolled-once, so a lead who already ran through it is never enrolled a second time no matter how many times you change the stage, and the rescue silently never sends. Hence the <code>##</code> - No Show stage and <code>##</code>-40.</p>'+
      '<p class="flag"><b>Enrolled once = Yes everywhere except <code>##</code>-30.</b> Pre-visit must fire on every appointment a member ever books, so it is the one sequence where the answer is No. Everywhere else, Yes, or a lead whose stage moves twice gets the whole drip twice.</p>'+
      '<p class="flag"><b>Eden Prairie and Savage have live sequences already.</b> The Savage Local Drip and the Eden Prairie legacy router are running against real leads. Disabling an old sequence stops its remaining actions; it does not transfer enrolled leads to the new sequence, because their enrollment trigger already happened. A clean cutover has two separate cohorts: newly created leads route only to the new trigger, while leads already listed under Customers in the old sequence finish there with that sequence still enabled. Once the old Customers list has cleared, the old sequence is inactive. If its trigger cannot be closed to new leads separately, the active leads need an explicit migration decision; manual enrollment in the new sequence restarts its timing at day 0.</p>'+
      '<p><b>Stages, per studio:</b> <b>MTKA - Intro Nurture</b>, <b>MTKA - Long Term</b>, <b>MTKA - Not Interested</b>, and <b>MTKA - No Show</b>, repeated with SLP, EP, and SAV. Studio-specific lead sources stamp Intro Nurture at creation. No Show triggers <code>##</code>-40. Not Interested is where a "not now" reply lands.</p><p><b>Shared stage:</b> <b>TC - Unassigned</b>. Generic Twin Cities and manual lead sources use this stage until the lead chooses a studio. Abandoned checkout remains a separate source-associated flow.</p><p class="flag"><b>Test this before you build anything else.</b> Confirm that "Lead assigned new stage" fires when a default stage is applied at lead creation. If it only fires after a human stage change, both the studio entry sequences and TC - Unassigned need a different entry trigger. Do not restore a per-studio catch-all; four copies can race to assign four conflicting studio stages.</p>'+ 
      '<p><b>Uptime window:</b> 8 AM to 8 PM, one setting for the whole account. <b>Call window:</b> 10 AM to 3 PM Monday through Saturday, which is open at every Twin Cities studio on every day they operate, so it never needs a per-studio edit.</p>'+
      '</section>'+

      '<section class="panel"><h2>How to build an action</h2>'+
      '<p>Every sequence is two pages. <b>Page one</b> is the New sequence form above: name, trigger, enrollment toggle, association, and counter conditions. <b>Page two</b> is the builder, where you add the steps. Same for all of them.</p>'+
      '<p>In the builder, click <b>Add Step</b>, the + on the canvas, then choose one of two things:</p>'+
      '<table class="grid"><tbody>'+
      '<tr><td>Add Action</td><td>Does something: sends a message, assigns a task, changes a stage. Pick the <b>Action type</b>, then set <b>Timing</b>.</td></tr>'+
      '<tr><td>Add Condition</td><td>A true/false gate. It messages no one, it forks the path. Steps under the true side run only when the condition is met, steps under the false side run only when it is not.</td></tr>'+
      '</tbody></table>'+
      '<p><b>Action type</b> is a row of buttons, not a dropdown: <b>E-mail</b>, <b>SMS</b>, <b>Staff task</b>, <b>Add tags</b>, <b>Remove tags</b>, <b>Update lead stage</b>. This build uses four of the six and never touches the tag buttons. Every card on the Copy tab names the type and pastes the exact content.</p>'+
      '<p><b>Every action needs an Action name.</b> It is an internal label you type at the top of the action, next to an <b>Action enabled</b> toggle you leave on. The name never reaches the customer, it just keeps the builder readable. Each Copy card supplies one, numbered in build order like "1. SMS - Day 0, immediately", with a Copy button. Conditions take a name too.</p>'+
      '<p><b>Timing</b> is two buttons, <b>Immediately</b> and <b>Offset</b>. Immediately is the literal setting for a day 0 step, not an offset of zero. Everything else is Offset plus a number and a unit, and each Copy card spells out the exact entry in its own <b>Timing</b> line. On 30, where the trigger is Appointment visit enrolled On booking, Offset also lets you schedule <em>before</em> the visit, which is how the day-before and two-hour reminders sit ahead of the appointment.</p>'+
      '<p class="flag"><b>Under Timing there is a checkbox worth understanding once and then ignoring.</b> "Trigger action even if lead is enrolled after the action" makes a step whose due moment has already passed fire immediately instead of being skipped. It can only ever matter in <code>##</code>-30, because that is the only sequence with steps scheduled <em>before</em> the trigger. Every other step in this build is an offset forward from enrollment, so its due moment is never in the past and the box does nothing whichever way you set it.</p>'+
      '<p class="flag"><b>Inside <code>##</code>-30 the answer differs per step, so do not tick it across the board.</b> <b>Tick the 2-hour text.</b> Someone booking inside two hours gets it immediately and every word still holds, since it says "later today" and names no clock time. <b>Leave the 24-hour email unticked.</b> Its subject and first line both say <em>tomorrow</em>, so firing it at a same-day booker tells them the wrong day. Those people still receive the Momence booking confirmation and the 2-hour text. The alternative is to strip both uses of "tomorrow" so the email is true whenever it lands.</p>'+ 
      '<p class="flag"><b>Staff tasks have an email toggle at the bottom of the dialog, and it is the reason inboxes fill up.</b> "Send new task and reminder emails" sends one email the moment the task is assigned, then <em>another 24 hours later if nobody has marked it complete</em>. Because tasks assign <b>By staff role</b>, both go to everyone holding Front desk. Ten task steps, four studios, two emails each, times headcount, is a 20-a-day inbox. Leave it <b>off</b> on every task except the day 0 <b>NEW LEAD - call now</b>, which is the only one measured in minutes rather than days. The board carries the rest, and the lead still gets their day 0 text automatically either way.</p>'+
      '<p><b>Conditions</b> live under Add Step &gt; Add Condition. Available choices include Lead is already a customer, Customer has active membership, Lead has a stage assigned, Email opened, Email sent, and Link in email clicked. Each one forks the flow into a True and a False branch. A condition is itself a timed step, so set its offset the same way. Sequence 50 uses a terminal booking gate; sequence 70 deliberately merges its 14-day branches before checking current membership status again at day 28.</p>'+
      '<p><b>Merge variables.</b> Momence auto-fills {{first_name}}, {{last_name}}, {{email}}, and the host fields {{host_name}}, {{host_website}}, {{host_email}}, {{host_phone_number}}. This build uses only {{first_name}} and hard-types everything else per studio, so one studio\'s copy can never leak another studio\'s phone number.</p>'+
      '<p class="flag"><b>Nothing sends until you enable it.</b> A new sequence starts inactive. Build the whole thing, send one test lead through, then click Enable at the top. To pull one person without unsubscribing them from all marketing: open the sequence, Customers, the three dots by their name, Stop running.</p>'+
      '<p class="flag"><b>Anything tied to a calendar date does not belong in a sequence.</b> Every step here fires on an offset from the moment that person enrolled, and people enroll continuously, so a given step lands in a different month for every lead. That is fine for "what a screening finds" and useless for "March golf prep," which would reach a third of the list in November. The split is clean: <b>sequences are enrollment-driven</b>, so their copy has to be true in any month, and <b>broadcasts are calendar-driven</b> and go out on the real date. The five seasonal pushes (late-December restart, March golf prep, June summer ramp, September back to routine, November gift cards) are one-off sends to a filtered list, written the week they go out so they can name what is actually happening. That is less work than maintaining seasonal variants inside a sequence, not more, and it is the only version that lands on the right date.</p>'+
      '</section>'+
      '<section class="panel"><h2>Redirect map</h2>'+
      '<p>Two destination patterns, one row of values per studio. Use a 302 or 307, never a 301: browsers cache 301s forever, so if a board ID changes you cannot repoint links already sitting in someone\'s text thread.</p>'+
      '<p class="pattern"><b>Booking</b><br><code>https://momence.com/The-Vital-Stretch-Twin-Cities/appointment-reservation/49534?boardId={board}&amp;serviceId=220303&amp;venueId={venue}&amp;staffId=-1</code></p>'+
      '<p class="pattern"><b>Review</b><br><code>https://search.google.com/local/writereview?placeid={place id}</code></p>'+
      '<table class="grid"><thead><tr><th>Studio</th><th>Prefix</th><th>Booking</th><th>Review</th><th>Board</th><th>Venue</th><th>Place ID</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      '<p>Host ID 49534, service ID 220303 and staff ID -1 are the same at all four. Hang UTMs off the destination, not the short link, so the short link stays 20 characters.</p>'+
      '</section>'+

      '<section class="panel"><h2>SMS rules</h2>'+
      '<p><b>You are billed per segment, and one wrong character triples the bill.</b> A message is 160 characters if every character is in the GSM-7 alphabet. A single curly apostrophe, curly quote, em dash, ellipsis or emoji re-encodes the whole thing and drops the limit to 70.</p>'+
      '<p>Type SMS copy in a plain text editor. Never Word, never Google Docs, both of which insert curly quotes automatically. Every text in this build is verified GSM-7 clean and one segment at worst case, meaning the longest studio name, either sender, and a twelve-character first name.</p>'+
      '<p class="flag"><b>One Twilio number serves all four studios.</b> A carrier-level STOP blocks a phone number from a sender, so someone who opts out of Minnetonka becomes unreachable by St Louis Park too, silently, forever. Twilio returns error 21610 and nothing tells you. Per-studio numbers fix the blast radius and also solve the shared reply inbox.</p>'+
      '<p><b>STOP also blocks appointment reminders</b>, not just marketing. That is carrier behavior and no setting changes it. The confirmation and 24-hour reminder are emails for exactly this reason, but front desk needs to know an opted-out client is email-only.</p>'+
      '<p><b>Twilio catches STOP, UNSUBSCRIBE, END, QUIT, STOPALL, REVOKE, OPTOUT and CANCEL automatically.</b> It does not catch "OPT OUT" with a space, or "stop texting me," or "remove me." Those arrive as normal inbound messages and a human has to act: stop every running sequence for that person, set the Not Interested stage, and send nothing back.</p>'+
      '</section>'+

      '<section class="panel"><h2>Momence features this build uses</h2>'+
      '<table class="grid"><tbody>'+
      '<tr><td>Update lead stage</td><td>The action that chains everything. Each sequence ends by setting a stage and the next triggers on it. Visible on the Leads list, unlike a tag.</td></tr>'+
      '<tr><td>Counter conditions</td><td>On nearly every sequence. Without them a lead who books on day one keeps getting chased through day twenty-one. A counter is an exit, not a step-level gate, and its all-time versus after-enrollment scope decides whether the sequence works at all.</td></tr>'+
      '<tr><td>True/false conditions</td><td>Available choices include Customer has active membership plus lead, email and link-status checks. A condition forks the flow into True and False branches, each a timed step you can offset, with AND/OR stacking. Sequence 50 uses a terminal booking fork; sequence 70 merges its first pair of branches and checks membership status again before the second touch.</td></tr>'+
      '<tr><td>Enrollment once</td><td>Yes everywhere except Pre-visit, which must fire on every appointment.</td></tr>'+
      '<tr><td>Uptime window</td><td>One setting. Anything triggered outside it reschedules instead of texting someone at 2 AM.</td></tr>'+
      '<tr><td>Staff Task by Role</td><td>Assign to Front Desk, never a named person, so it survives turnover. The email toggle on each task stays off except the day 0 new-lead call.</td></tr>'+
      '<tr><td>On booking vs on check-in</td><td>On booking is the only setting that unlocks actions scheduled before the trigger, which is what makes pre-visit reminders possible at all.</td></tr>'+
      '<tr><td>Visit number targeting</td><td>One Appointment visit trigger set to a specific visit number. Visit 1 drives 50, visit 2 drives 60, both enrolled On check-in.</td></tr>'+
      '<tr><td>Lead source association</td><td>Ties each router to its studio so a lead never gets the wrong landmark and the wrong phone number.</td></tr>'+
      '<tr><td>Win-back trigger</td><td>Confirmed present (search "win"). Based on the last class or appointment visit. Sequence 70 checks active membership at days 14 and 28, offers a complimentary sauna comeback, and exits on a new appointment booking or membership purchase.</td></tr>'+
      '<tr><td>Subscription cancellation</td><td>Fires the save attempt the moment a cancellation processes.</td></tr>'+
      '<tr><td>Restrict by tag</td><td>Tag anyone who buys the intro, then restrict the $29 offer to customers without it. That is how one-per-person becomes true instead of aspirational.</td></tr>'+
      '<tr><td>Segmented list</td><td>Filter, then Contact customers. This is how a one-off blast goes out, not through a sequence, and it is where all five seasonal pushes live: filter to the Long Term stage, write one paragraph, send it on the actual date.</td></tr>'+
      '<tr><td>Duplicate folder</td><td>Build Minnetonka once, duplicate three times, work the redirect map above.</td></tr>'+
      '<tr><td>Stop running</td><td>Sequences, select, Customers, three dots. How front desk honors a plain-English opt-out without unsubscribing someone from all marketing.</td></tr>'+
      '</tbody></table>'+
      '<p><b>Not used:</b> the missed-call triggers. They only fire when calls run through Momence, and ours do not.</p>'+
      '<p><b>Worth building later, drawn from the full trigger list:</b></p>'+
      '<table class="grid"><tbody>'+
      '<tr><td>Intro offer purchase / expiration</td><td>Only if the $29 is ever sold as a prepaid Intro Offer rather than a direct booking. Purchase would nudge a buyer who has not booked visit 1; expiration would rescue one who let it lapse unused. If the $29 is always a direct booking, 30 and 50 already cover them and there is nothing to add.</td></tr>'+
      '<tr><td>Customer referred</td><td>A referral welcome and booking nudge for the person a member sends in. Fires on the referral link, not a dashboard-created referral.</td></tr>'+
      '<tr><td>Birthday</td><td>Needs a customer custom field with "birthday" in the name before it can fire at anyone.</td></tr>'+
      '<tr><td>Appointment visit, milestone number</td><td>A tenth or twenty-fifth session recognition, using the same Appointment visit trigger set to that number.</td></tr>'+
      '<tr><td>Credits left in pack</td><td>Once Flex Packs are selling.</td></tr>'+
      '</tbody></table>'+
      '</section>'+

      '<section class="panel"><h2>Brand check</h2>'+
      '<p><b>Palette and type.</b> Deep Blue #013160, Light Blue #71BED2, Yellow #FBB514. Headers are Yeseva One and body is Futura Com Book. Both are licensed faces most email clients will not have, so build one branded Momence template with Georgia and Arial as the fallback and stop fighting it. In an inbox the brand lives in the words and the color.</p>'+
      '<p><b>Language baked in.</b> Vital Stretch Practitioner (VSP), Strap In / Let Loose / Say Ahhh, Active Isolated Stretching, PNF, "looser, lighter and fully alive," the four benefit pillars, and the mandated signature closing every email.</p>'+
      '</section>';
  })();

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escA(s){ return esc(s).replace(/"/g,'&quot;'); }
  function q(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

  function meterHTML(chk){
    return '<div class="meter"><div class="track"><div class="fill'+(chk.cost>160?' over':'')+'" style="width:'+

  function paintImg(f){

    var st = f.querySelector('[data-imgstate]');

      st.textContent = 'no URL yet'; st.className = 'imgstate none';
      prev.innerHTML = '<span class="imgnote">Nothing to preview. Paste a URL and the image loads here at the exact width it will be in the email.</span>';

    prev.innerHTML = '<span class="imgnote">Loading...</span>';
    var probe = new Image();
    probe.onload = function(){
      if (stale()) return;
      var w = probe.naturalWidth, h = probe.naturalHeight, notes = [];
      if (w < 1200) notes.push('only '+w+' px wide, under the 1200 px minimum, so it will look soft on a phone');
      if (h > w) notes.push('taller than it is wide, and this slot is a landscape banner across the top of the email');
      if (/^http:\/\//i.test(url)) notes.push('served over plain http, which several email clients block outright');
      st.textContent = notes.length ? 'loads, with notes' : 'loads fine';
      st.className = 'imgstate'+(notes.length?' none':'');
      prev.innerHTML = '<img src="'+escA(url)+'" alt="">'+
        '<span class="imgnote'+(notes.length?' bad':'')+'">'+w+' x '+h+' px, shown at 600 px in the email.'+
        (notes.length ? ' ' + esc(notes.join('. ')) + '.' : '')+'</span>';
    };

  function stripVars(t){
    return (t||'').replace(/\{\{[^}]+\}\}/g,'').replace(/\{[A-Z]+\}/g,'')
      .replace(/\s+/g,' ').replace(/,\s*([?.!])/g,'$1').replace(/\s+([?.!,])/g,'$1')
      .replace(/[-\s,]+$/,'').trim();
  }
  function clip(t, max){ t = t||''; return t.length>max ? t.slice(0,max-1).replace(/[-\s,;:.]+$/,'')+'\u2026' : t; }
  function actionName(it, n, s){
    var word = it.t==='cond' ? 'Condition' : (it.t==='sms'?'SMS':(it.t==='email'?'Email':(it.t==='stage'?'Stage':'Task')));
    var hint;
    if (it.nm) hint = fill(it.nm, s);
    else if (it.t==='email') hint = clip(stripVars(it.subj), 42);
    else if (it.t==='task') hint = clip(stripVars(it.title), 42);
    else if (it.t==='stage'){ var m=/set stage to:\s*(.+)/i.exec(it.text||''); hint = m ? clip(stripVars(m[1]).replace(/^[-\s]+/,''),42) : 'Update stage'; }
    else hint = clip(stripVars(it.when), 42) || 'Text';
    return n+'. '+word+' - '+hint;
  }
  function timing(it){
    var w = it.when||'';
    if (/^24 hours before$/i.test(w)) return 'Offset, 1 day before the visit (needs On booking)';
    var mb = /^(\d+)\s*hours? before$/i.exec(w);
    if (mb) return 'Offset, '+mb[1]+' hours before the visit (needs On booking)';
    if (/^immediately on booking$/i.test(w)) return 'Immediately';
    if (/^immediately$/i.test(w)) return 'Immediately';
    var mm = /^Day\s*0,\s*\+(\d+)\s*minutes?$/i.exec(w);
    if (mm) return 'Offset, '+mm[1]+' minutes after the trigger';
    var mmh = /^Day\s*0,\s*\+(\d+)\s*hours?$/i.exec(w);
    if (mmh) return 'Offset, '+mmh[1]+' hours after the trigger';
    if (/^Day\s*0,\s*immediately$/i.test(w)) return 'Immediately';
    var md = /^Day\s*(\d+)\b/i.exec(w);
    if (md){ var d=+md[1]; return d===0 ? 'Immediately' : ('Offset, '+d+' day'+(d===1?'':'s')+' after the trigger'); }
    var mh = /\+(\d+)\s*hours?/i.exec(w);
    if (mh) return 'Offset, '+mh[1]+' hours after the trigger';
    var mw = /^(\d+)\s*days since last visit$/i.exec(w);
    if (mw) return 'Days-after-win-back field: '+mw[1]+' days';
    return w;
  }

        intro = '<p class="meta">'+fill(g.meta,contentStudio)+'</p>';
      }
            return '<section class="seq band-'+band+'" data-seq="'+num+'"><div class="spine"><span class="spinelabel">'+(num==='launch'?'SWAP IN':(num==='unassigned'||num==='abandoned'?'SHARED FLOW':'SEQUENCE'))+'</span></div>'+ 
              '<div class="seqbody"><h2>'+fill(g.seq,contentStudio)+'</h2>'+ 
             intro +
             '<p class="stepcount">Then add these '+g.items.length+' steps, in order:'+
             '<span class="prog">'+built+' of '+g.items.length+' built</span></p>'+
             '<div class="steps">'+steps+'</div></div></section>';
    }).join('');

    var tabs = '<div class="tabs"><button data-v="overview" aria-pressed="'+(view==='overview')+'">Overview</button>'+
      '<button data-v="copy" aria-pressed="'+(view==='copy')+'">Twin Cities Copy</button>'+
      '<button data-v="shared" aria-pressed="'+(view==='shared')+'">Shared Flows</button>'+ 
      '<button data-v="studio" aria-pressed="'+(view==='studio')+'">Build a studio</button></div>';

    var head = '<div class="stickytop"><div class="hd"><h1>Nurture console <span>/ The Vital Stretch</span></h1>'+
      (view==='copy' ? '<div class="picker">'+picker+'</div>' : '')+'</div><div class="tabbar">'+tabs+'</div>'+
      (view==='copy' || view==='shared' ? indexHTML() : '')+'</div>';

    var hint = '<div class="hint"><b>Copying does not track progress.</b> When a step is actually built in Momence, '+
      'click its numbered circle or the <b>Mark built</b> button on the right of that step. The counter in the bar above, '+
      'the coloured chips and the per-sequence tally all follow from that. Progress is saved in this browser only, '+
      'and separately for each studio, since each studio is a separate build.</div>';

    if (view==='overview') root.innerHTML = head + '<div class="wrap">'+OVERVIEW+'</div>';
    else if (view==='studio'){ root.innerHTML = head + '<div class="wrap">'+studioPanelHTML()+'</div>'; paintStudio(); }
    else if (view==='shared'){ root.innerHTML = head + '<div class="wrap">'+hint+body+'</div>'; paintAllImgs(); }
    else { root.innerHTML = head + bar + '<div class="wrap">'+hint+body+'</div>'; paintAllImgs(); }
  }

  function flash(btn, msg){ var o=btn.textContent; btn.textContent=msg; btn.classList.add('done');
    setTimeout(function(){ btn.textContent=o; btn.classList.remove('done'); },1400); }
  function selectFallback(el, btn){
    var r=document.createRange(); r.selectNodeContents(el);
    var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    flash(btn, ok?'Copied':'Selected, press Ctrl+C');
  }
  function copyRich(el, html, btn){
    if (navigator.clipboard && window.ClipboardItem){
      navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html],{type:'text/html'}),
        'text/plain': new Blob([el.innerText],{type:'text/plain'})
      })]).then(function(){ flash(btn,'Copied'); }, function(){ selectFallback(el,btn); });
    } else selectFallback(el,btn);
  }
  function legacyText(str, btn){
    var ta = document.createElement('textarea');
    ta.value = str; ta.style.position='fixed'; ta.style.top='-9999px';
    document.body.appendChild(ta); ta.select();
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    flash(btn, ok?'Copied':'Copy failed');
  }
  function copyText(str, btn){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(str).then(function(){ flash(btn,'Copied'); }, function(){ legacyText(str,btn); });
    } else legacyText(str, btn);
  }
  function copyPlain(el, btn){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(el.innerText).then(function(){ flash(btn,'Copied'); }, function(){ selectFallback(el,btn); });
    } else selectFallback(el,btn);
  }

  root.addEventListener('click', function(e){
    var vb = e.target.closest('.tabs button');
    if (vb){ render(root.getAttribute('data-studio'), vb.getAttribute('data-v')); window.scrollTo(0,0); return; }
    var pb = e.target.closest('.picker button');
    if (pb){ render(pb.getAttribute('data-k')); window.scrollTo(0,0); return; }
    var pr = e.target.closest('[data-preset]');
    if (pr){
      var pk = pr.getAttribute('data-preset');
      if (pk==='clear') custom = {};
      else { custom = {}; Object.keys(STUDIOS[pk]).forEach(function(k){ custom[k] = STUDIOS[pk][k]; }); }
      saveCustom(); render(root.getAttribute('data-studio'), 'studio'); window.scrollTo(0,0); return;
    }
    if (e.target.closest('[data-usecustom]')){
      if (!customStudio()){ alert('A studio name and a sequence prefix are the two fields it cannot run without.'); return; }
      render('cu', 'copy'); window.scrollTo(0,0); return;
    }
    var pg = e.target.closest('[data-ping]');
    if (pg){ ping(pg.getAttribute('data-ping'), pg); return; }
    var oi = e.target.closest('[data-openimg]');
    if (oi){
      var inp = oi.closest('.urlrow').querySelector('[data-imgurl]');
      var u = inp.value.trim();
      if (u) window.open(u, '_blank', 'noopener');
      return;
    }
    var gb = e.target.closest('.index .chips button');
    if (gb){
      var target = root.querySelector('.seq[data-seq="'+gb.getAttribute('data-goto')+'"]');
      if (target) target.scrollIntoView({block:'start'});
      return;
    }
    var rb = e.target.closest('.index .reset');
    if (rb){
      if (!rb.classList.contains('arm')){
        rb.classList.add('arm'); rb.textContent='Sure?';
        setTimeout(function(){ if (rb.isConnected){ rb.classList.remove('arm'); rb.textContent='Reset'; } }, 3000);
        return;
      }
      Object.keys(done).forEach(function(k){ if (k.indexOf(curKey+'-')===0) delete done[k]; });
      saveDone(); render(curKey); return;
    }
    var nb = e.target.closest('.stepnum, .mark');
    if (nb && nb.getAttribute('data-step')){
      var id = nb.getAttribute('data-step');
      if (done[id]) delete done[id]; else done[id] = 1;
      saveDone();
      var seq = nb.closest('.seq'), card = nb.closest('.card');
      card.classList.toggle('done', !!done[id]);
      card.querySelectorAll('[data-step]').forEach(function(b){ b.setAttribute('aria-pressed', !!done[id]); });
      card.querySelectorAll('.mark').forEach(function(b){ b.textContent = done[id] ? 'Built' : 'Mark built'; });
      var prog = seq.querySelector('.prog'), cards = seq.querySelectorAll('.card');
      prog.textContent = seq.querySelectorAll('.card.done').length+' of '+cards.length+' built';
      refreshIndex();
      return;
    }
    var cb = e.target.closest('.copy');
    if (!cb) return;
    var f = cb.closest('.field');
    if (!f) return;
    var mode = cb.getAttribute('data-mode');
    var src = f.querySelector('[data-html]');
    var owner = cb.closest('.card'), iid = owner && owner.getAttribute('data-img-id');
    function withImg(v){
      var u = iid ? String(imgUrls[iid]||'').trim() : '';
      return u ? v.split(IMG_TOKEN).join(u) : v;
    }
    if (mode==='html') copyText(withImg(src.value), cb);
    else if (mode==='rich') copyRich(f.querySelector('[data-content]'), withImg(src.value), cb);
    else copyPlain(f.querySelector('[data-content]'), cb);
  });

  var typeTimer;
  function onEdit(t){
    if (t.hasAttribute('data-imgurl')){
      var id = t.getAttribute('data-imgurl');
      imgUrls[id] = t.value.trim();
      saveImgs();
      clearTimeout(typeTimer);
      typeTimer = setTimeout(function(){
        root.querySelectorAll('[data-imgfield="'+id+'"]').forEach(paintImg);
      }, 450);
      return;
    }
    if (t.hasAttribute('data-fld')){
      var k = t.getAttribute('data-fld');
      custom[k] = (t.type==='checkbox') ? t.checked : t.value;
      saveCustom();
      clearTimeout(typeTimer);
      typeTimer = setTimeout(paintStudio, 300);
    }
  }
  root.addEventListener('input', function(e){ onEdit(e.target); });
  root.addEventListener('change', function(e){ if (e.target.type==='checkbox') onEdit(e.target); });

  render('mt','overview');
})();
</script>
