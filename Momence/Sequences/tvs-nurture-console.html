<div id="tvs-root"></div>

<style>
#tvs-root {
  --deep:#013160; --lightblue:#71BED2; --yellow:#FBB514;
  --paper:#F4F7F9; --ink:#013160; --ink-soft:#5A7189;
  --rule:#D3DEE6; --red:#B3352A;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: "Futura", "Futura PT", "Century Gothic", "Avenir Next", "Avenir", ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --display: "Yeseva One", "Playfair Display", "Bodoni MT", Didot, Georgia, serif;
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.5; padding:0 0 60px; margin:0;
}
#tvs-root *, #tvs-root *::before, #tvs-root *::after { box-sizing:border-box; }

#tvs-root .stickytop { position:sticky; top:0; z-index:20; }
#tvs-root .hd { background:var(--deep); color:#fff;
  padding:14px 20px; display:flex; flex-wrap:wrap; gap:16px; align-items:center; border-bottom:3px solid var(--yellow); }
#tvs-root .hd h1 { font-family:var(--display); font-size:19px; font-weight:400; margin:0; flex:1 1 auto; min-width:200px; }
#tvs-root .hd h1 span { color:var(--lightblue); font-size:14px; }
#tvs-root .picker { display:flex; gap:6px; flex-wrap:wrap; }
#tvs-root .picker button { font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.04em;
  padding:7px 13px; border:1px solid #2E5A83; background:transparent; color:#fff; cursor:pointer; border-radius:2px; }
#tvs-root .picker button:hover { border-color:var(--yellow); }
#tvs-root .picker button[aria-pressed="true"] { background:var(--yellow); border-color:var(--yellow); color:var(--deep); }
#tvs-root .picker button:focus-visible { outline:2px solid var(--lightblue); outline-offset:2px; }

#tvs-root .tabbar { background:#fff; border-bottom:1px solid var(--rule); padding:0 20px; }
#tvs-root .tabs { display:flex; max-width:820px; margin:0 auto; overflow-x:auto; }
#tvs-root .tabs button { font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:.03em;
  padding:12px 20px; border:0; border-bottom:3px solid transparent; background:none; color:var(--ink-soft); cursor:pointer; flex:0 0 auto; }
#tvs-root .tabs button[aria-pressed="true"] { color:var(--deep); border-bottom-color:var(--yellow); }
#tvs-root .tabs button:hover { color:var(--deep); }
#tvs-root .tabs button:focus-visible { outline:2px solid var(--lightblue); outline-offset:-4px; }

#tvs-root .index { background:#fff; border-bottom:1px solid var(--rule); padding:7px 20px;
  display:flex; align-items:center; gap:10px; }
#tvs-root .index .chips { display:flex; gap:5px; flex:1 1 auto; overflow-x:auto; }
#tvs-root .index .chips button { font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.04em;
  padding:4px 9px; border:1px solid var(--rule); background:#fff; color:var(--ink-soft);
  cursor:pointer; border-radius:2px; flex:0 0 auto; }
#tvs-root .index .chips button:hover { border-color:var(--deep); color:var(--deep); }
#tvs-root .index .chips button.part { border-color:var(--yellow); color:var(--deep); }
#tvs-root .index .chips button.full { background:var(--lightblue); border-color:var(--lightblue); color:var(--deep); }
#tvs-root .index button:focus-visible { outline:2px solid var(--lightblue); outline-offset:2px; }
#tvs-root .index .tally { font-family:var(--mono); font-size:11px; color:var(--ink-soft); flex:0 0 auto; white-space:nowrap; }
#tvs-root .index .reset { font-family:var(--sans); font-size:11px; font-weight:600; padding:4px 9px;
  border:1px solid var(--rule); background:#fff; color:var(--ink-soft); cursor:pointer; border-radius:2px; flex:0 0 auto; }
#tvs-root .index .reset:hover, #tvs-root .index .reset.arm { border-color:var(--red); color:var(--red); }

#tvs-root .studiobar { background:#fff; border-bottom:1px solid var(--rule); padding:12px 20px;
  display:flex; flex-wrap:wrap; gap:10px 26px; font-size:12.5px; color:var(--ink-soft); }
#tvs-root .studiobar b { color:var(--ink); font-weight:600; }
#tvs-root .studiobar code { font-family:var(--mono); font-size:12px; background:var(--paper);
  padding:1px 5px; border:1px solid var(--rule); border-radius:2px; }

#tvs-root .wrap { max-width:820px; margin:0 auto; padding:0 20px; }

#tvs-root .panel { margin-top:30px; }
#tvs-root .panel > h2, #tvs-root .seq > h2 { font-family:var(--display); font-size:20px; font-weight:400;
  margin:0 0 4px; padding-bottom:8px; border-bottom:2px solid var(--lightblue); }
#tvs-root .panel p { max-width:74ch; font-size:14px; margin:14px 0 0; color:var(--ink-soft); }
#tvs-root .panel p b { color:var(--ink); }
#tvs-root .panel p.flag { padding:12px 14px; border-left:3px solid var(--yellow); background:#FFF8E8; color:#6B5410; }
#tvs-root .panel p.flag b { color:var(--deep); }
#tvs-root .panel svg { display:block; width:100%; height:auto; margin-top:16px; }
#tvs-root .svgh { font-family:var(--display); font-size:15px; fill:#013160; }
#tvs-root .svgt { font-family:var(--sans); font-size:13.5px; font-weight:600; }
#tvs-root .svgs { font-family:var(--sans); font-size:12px; }

#tvs-root table.grid { border-collapse:collapse; width:100%; font-size:12.5px; margin:16px 0 4px; }
#tvs-root table.grid th { text-align:left; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-soft); border-bottom:1px solid var(--deep); padding:0 10px 6px 0; font-weight:600; }
#tvs-root table.grid td { border-bottom:1px solid var(--rule); padding:8px 10px 8px 0; color:var(--ink-soft); vertical-align:top; }
#tvs-root table.grid td:first-child { color:var(--ink); font-weight:600; white-space:nowrap; }
#tvs-root table.grid code { font-family:var(--mono); font-size:11.5px; background:var(--paper);
  padding:2px 5px; border:1px solid var(--rule); border-radius:2px; }
#tvs-root table.grid code.pid { font-size:10px; word-break:break-all; }
#tvs-root p.pattern code { display:inline-block; margin-top:4px; font-family:var(--mono); font-size:11px;
  word-break:break-all; background:var(--paper); padding:6px 8px; border:1px solid var(--rule); color:var(--ink-soft); }


#tvs-root .seqbody > p.meta { font-size:13px; color:var(--ink-soft); margin:10px 0 0; max-width:74ch; }
#tvs-root .card { border:1px solid var(--rule); background:#fff; margin-top:16px; }
#tvs-root .card > header { display:flex; align-items:center; gap:10px; padding:9px 14px;
  border-bottom:1px solid var(--rule); background:#FBFDFE; }
#tvs-root .chan { font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.1em;
  padding:3px 7px; border-radius:2px; flex:0 0 auto; }
#tvs-root .chan.sms { background:var(--lightblue); color:var(--deep); }
#tvs-root .chan.email { background:var(--deep); color:#fff; }
#tvs-root .chan.task { background:var(--yellow); color:var(--deep); }
#tvs-root .chan.cond { background:#fff; color:var(--deep); border:1px dashed var(--deep); }
#tvs-root .chan.stage { background:#E3EEF5; color:var(--deep); border:1px solid var(--deep); }
#tvs-root .when { font-size:12px; font-weight:400; color:var(--ink-soft); flex:1 1 auto; text-align:right; }
#tvs-root .card > header .cost { font-family:var(--mono); font-size:11px; color:var(--ink-soft); }
#tvs-root .copy { font-family:var(--sans); font-size:11.5px; font-weight:600; padding:5px 11px;
  border:1px solid var(--deep); background:#fff; color:var(--deep); cursor:pointer; border-radius:2px; flex:0 0 auto; }
#tvs-root .copy:hover { background:var(--deep); color:#fff; }
#tvs-root .copy:focus-visible { outline:2px solid var(--lightblue); outline-offset:2px; }
#tvs-root .copy.done { background:var(--lightblue); border-color:var(--lightblue); color:var(--deep); }
#tvs-root .body { padding:16px 18px; }

#tvs-root .smstext { font-family:var(--mono); font-size:13.5px; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
#tvs-root .meter { margin-top:12px; }
#tvs-root .track { height:4px; background:var(--rule); overflow:hidden; }
#tvs-root .fill { height:100%; background:var(--lightblue); transition:width .18s; }
#tvs-root .fill.over { background:var(--red); }
#tvs-root .mrow { display:flex; justify-content:space-between; gap:12px; margin-top:6px;
  font-family:var(--mono); font-size:11px; color:var(--ink-soft); }
#tvs-root .mrow b { color:var(--ink); }
#tvs-root .mrow .bad { color:var(--red); font-weight:700; }


#tvs-root .howto { margin:0 0 14px; font-size:12.5px; line-height:1.5; color:var(--ink-soft); background:#F4F7F9; border:1px solid var(--rule); border-radius:6px; padding:9px 12px; }
#tvs-root .howto b { color:var(--deep); }
#tvs-root .aname { font-family:var(--mono); font-size:13px; font-weight:700; color:var(--deep);
  background:var(--paper); border:1px solid var(--rule); border-radius:2px; padding:6px 9px; word-break:break-word; }
#tvs-root .atime { font-family:var(--mono); font-size:12.5px; color:var(--ink); background:var(--paper); border:1px solid var(--rule); border-left:3px solid var(--lightblue); border-radius:2px; padding:6px 9px; }
#tvs-root .field { margin:0 0 14px; }
#tvs-root .field textarea[hidden] { display:none; }
#tvs-root .field:last-child { margin-bottom:0; }
#tvs-root .fieldrow { display:flex; align-items:center; gap:10px; margin:0 0 5px; }
#tvs-root .fieldlabel { font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin:0; flex:1 1 auto; }
#tvs-root .fieldrow .copy { flex:0 0 auto; padding:3px 9px; font-size:10.5px; letter-spacing:.02em; }
#tvs-root .subj { font-family:var(--sans); font-size:14px; font-weight:700; margin:0; }
#tvs-root .etext { font-family:var(--serif); font-size:15px; line-height:1.62; }
#tvs-root .etext p { margin:0 0 14px; }
#tvs-root .etext p:last-child { margin-bottom:0; }
#tvs-root .etext .sig { color:var(--ink-soft); font-size:14px; }
#tvs-root .etext .tagline { font-family:var(--display); color:var(--deep); font-size:15px; }
#tvs-root .etext .cta { margin:18px 0; }
#tvs-root .etext .cta a { display:inline-block; background:var(--deep); color:#fff !important;
  text-decoration:none; font-family:var(--sans); font-weight:700; font-size:14px; padding:12px 22px; border-radius:3px; }
#tvs-root .etext ul { margin:0 0 14px; padding-left:20px; }
#tvs-root .etext li { margin-bottom:7px; }
#tvs-root .etext h4 { font-family:var(--sans); font-size:13px; letter-spacing:.06em; text-transform:uppercase;
  margin:18px 0 6px; color:var(--deep); }

#tvs-root .tasktext { font-family:var(--mono); font-size:12.5px; line-height:1.6; white-space:pre-wrap; }
#tvs-root .tasktitle { font-family:var(--mono); font-size:12px; margin:0; color:var(--ink-soft); }
#tvs-root .tasktitle b { color:var(--ink); }
#tvs-root .note { border-left:3px solid var(--yellow); background:#FFF8E8; padding:11px 14px;
  font-size:13px; margin-top:16px; color:#6B5410; }
#tvs-root .note b { color:var(--deep); }
#tvs-root .photo { display:flex; gap:10px; align-items:flex-start; margin:0 0 14px; padding:9px 12px; border:1px dashed var(--lightblue); background:#EEF7FA; border-radius:6px; font-size:12.5px; color:var(--deep); line-height:1.5; }
#tvs-root .photo::before { content:"PHOTO"; flex:0 0 auto; font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.12em; background:var(--lightblue); color:var(--deep); padding:3px 6px; border-radius:2px; }


#tvs-root .seq { margin-top:38px; display:flex; gap:0; }
#tvs-root .spine { flex:0 0 30px; position:relative; border-radius:6px 0 0 6px; }
#tvs-root .band-lead   .spine { background:#E3EEF5; }
#tvs-root .band-intro  .spine { background:#71BED2; }
#tvs-root .band-member .spine { background:#FBB514; }
#tvs-root .spinelabel {
  position:absolute; top:14px; left:50%; transform:translateX(-50%) rotate(180deg);
  writing-mode:vertical-rl; font-family:var(--mono); font-size:9px; font-weight:700;
  letter-spacing:.22em; color:var(--deep);
}
#tvs-root .band-intro .spinelabel { color:var(--deep); }
#tvs-root .seqbody { flex:1 1 auto; min-width:0; padding-left:18px; }
#tvs-root .seqbody > h2 { margin-top:6px; }



#tvs-root .setupcard { border:1px solid var(--rule); background:#FBFDFE; border-radius:8px; padding:14px 16px; margin-top:14px; }
#tvs-root .setuphd { font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px; }
#tvs-root ol.setuplist { margin:0; padding-left:20px; }
#tvs-root ol.setuplist li { font-size:13.5px; color:var(--ink); margin-bottom:7px; line-height:1.45; }
#tvs-root ol.setuplist li::marker { font-weight:700; color:var(--deep); }
#tvs-root .setuplist .fld { display:inline-block; vertical-align:top; width:132px; font-weight:700; color:var(--deep); }
#tvs-root .setuplist .val { display:inline-block; vertical-align:top; width:calc(100% - 132px); padding-left:8px; }
#tvs-root .setupwhy { margin:12px 0 0; padding-top:10px; border-top:1px dashed var(--rule); font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
#tvs-root .stepcount { font-family:var(--sans); font-size:13px; font-weight:700; letter-spacing:0; text-transform:none; color:var(--deep); margin:20px 0 0; }
#tvs-root .stepcount .prog { font-family:var(--mono); font-size:11px; font-weight:400; color:var(--ink-soft); margin-left:10px; }

#tvs-root .steps { position:relative; margin-top:8px; }
#tvs-root .steps::before { content:''; position:absolute; left:15px; top:24px; bottom:24px; width:2px; background:var(--rule); }
#tvs-root .card { position:relative; margin-left:38px; }
#tvs-root .stepnum {
  position:absolute; left:-38px; top:8px; width:30px; height:30px; border-radius:50%;
  background:#fff; border:2px solid var(--deep); color:var(--deep);
  font-family:var(--sans); font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; z-index:1;
}
#tvs-root .band-intro .stepnum { border-color:#3E8FA8; }
#tvs-root .band-member .stepnum { border-color:#B9860F; }
#tvs-root button.stepnum { padding:0; }
#tvs-root .stepnum:hover { background:var(--paper); }
#tvs-root .stepnum:focus-visible { outline:2px solid var(--lightblue); outline-offset:2px; }
#tvs-root .card.done { opacity:.5; }
#tvs-root .card.done > header { background:var(--paper); }
#tvs-root .card.done .stepnum { background:var(--deep); border-color:var(--deep); color:#fff; }
#tvs-root .card.done + .note { opacity:.5; }
#tvs-root .mark { font-family:var(--sans); font-size:11px; font-weight:600; padding:4px 10px; flex:0 0 auto;
  border:1px solid var(--rule); background:#fff; color:var(--ink-soft); cursor:pointer; border-radius:2px; white-space:nowrap; }
#tvs-root .mark:hover { border-color:var(--deep); color:var(--deep); }
#tvs-root .mark:focus-visible { outline:2px solid var(--lightblue); outline-offset:2px; }
#tvs-root .card.done .mark { background:var(--deep); border-color:var(--deep); color:#fff; }
#tvs-root .cardfoot { display:flex; align-items:center; gap:10px; padding:8px 14px;
  border-top:1px solid var(--rule); background:#FBFDFE; }
#tvs-root .stepnum.foot { position:static; width:26px; height:26px; font-size:12px; }
#tvs-root .footwhen { flex:1 1 auto; font-size:12px; color:var(--ink-soft); }
#tvs-root .hint { max-width:820px; margin:18px auto 0; padding:10px 14px; border:1px solid var(--rule);
  border-left:3px solid var(--yellow); background:#fff; border-radius:2px; font-size:12.5px; color:var(--ink-soft); }
#tvs-root .hint b { color:var(--deep); }
#tvs-root .seq { scroll-margin-top:150px; }
#tvs-root .stepverb { font-family:var(--sans); font-size:12.5px; font-weight:700; color:var(--deep); flex:0 0 auto; }
#tvs-root .note { margin-left:38px; }

#tvs-root input[type="text"], #tvs-root input[type="url"] { font-family:var(--mono); font-size:12.5px; color:var(--ink);
  padding:7px 9px; border:1px solid var(--rule); border-radius:2px; background:#fff; width:100%; }
#tvs-root input[type="text"]:focus, #tvs-root input[type="url"]:focus { border-color:var(--deep); outline:2px solid var(--lightblue); outline-offset:-1px; }
#tvs-root .urlrow { display:flex; gap:8px; align-items:center; margin-top:9px; }
#tvs-root .urlrow input { flex:1 1 auto; min-width:0; }
#tvs-root .imgstate { font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  padding:3px 7px; border-radius:2px; background:var(--lightblue); color:var(--deep); flex:0 0 auto; }
#tvs-root .imgstate.none { background:#fff; border:1px solid var(--rule); color:var(--ink-soft); }
#tvs-root .imgstate.bad { background:var(--red); color:#fff; }
#tvs-root .imgprev { margin-top:9px; }
#tvs-root .imgprev img { display:block; width:100%; max-width:600px; height:auto; border:1px solid var(--rule); }
#tvs-root .imgnote { display:block; font-family:var(--mono); font-size:11px; line-height:1.5; color:var(--ink-soft); margin-top:6px; }
#tvs-root .imgnote.bad { color:var(--red); }
#tvs-root details.brief { margin-top:11px; border-top:1px dashed var(--rule); }
#tvs-root details.brief summary { cursor:pointer; list-style:none; padding:9px 0 0;
  font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); }
#tvs-root details.brief summary::-webkit-details-marker { display:none; }
#tvs-root details.brief summary::before { content:'+ '; color:var(--deep); }
#tvs-root details.brief[open] summary::before { content:'- '; }
#tvs-root details.brief summary:hover { color:var(--deep); }
#tvs-root details.brief summary:focus-visible { outline:2px solid var(--lightblue); outline-offset:2px; }
#tvs-root .briefbody { font-size:13px; line-height:1.55; color:var(--ink-soft); padding:9px 0 4px; }
#tvs-root .briefbody b { color:var(--ink); }
#tvs-root .briefbody ul { margin:9px 0 0; padding-left:18px; }
#tvs-root .briefbody li { margin-bottom:6px; }

#tvs-root .presets { display:flex; flex-wrap:wrap; gap:8px; margin-top:9px; }
#tvs-root .form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px 24px; margin-top:18px; }
#tvs-root .frow { min-width:0; }
#tvs-root .frow.wide { grid-column:1 / -1; }
#tvs-root .flabel { display:block; font-family:var(--mono); font-size:9.5px; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:4px; }
#tvs-root p.fhint { font-size:12px; line-height:1.45; color:var(--ink-soft); margin:0 0 7px; max-width:none; }
#tvs-root .fmsg { font-family:var(--mono); font-size:11px; line-height:1.45; color:var(--ink-soft); margin-top:5px; }
#tvs-root .fmsg.bad { color:var(--red); }
#tvs-root .fmsg.ok { color:var(--deep); }
#tvs-root .chk { display:flex; gap:9px; align-items:flex-start; font-size:13px; color:var(--ink); line-height:1.45; }
#tvs-root .chk input { margin-top:2px; flex:0 0 auto; }
#tvs-root .urlcheck { margin:0 0 14px; }
#tvs-root .urlcheck:last-child { margin-bottom:0; }
#tvs-root a.copy { text-decoration:none; display:inline-block; }
#tvs-root .banner { padding:11px 14px; border-left:3px solid var(--lightblue); background:#EEF7FA;
  font-size:13px; line-height:1.5; color:var(--deep); margin-top:18px; }
#tvs-root .banner.bad { border-left-color:var(--red); background:#FBEDEC; color:#7A241C; }
#tvs-root .banner b { color:var(--deep); }
#tvs-root .namelist { margin:0; padding-left:18px; font-family:var(--mono); font-size:12px; color:var(--ink); }
#tvs-root .namelist li { margin-bottom:4px; }
#tvs-root pre.json { font-family:var(--mono); font-size:11.5px; line-height:1.55; white-space:pre-wrap;
  word-break:break-word; margin:0; color:var(--ink); background:var(--paper);
  border:1px solid var(--rule); border-radius:2px; padding:10px 12px; }

#tvs-root { font-size:17px; line-height:1.55; }
#tvs-root .hd h1 { font-size:23px; }
#tvs-root .hd h1 span { font-size:16px; }
#tvs-root .picker button { font-size:14px; }
#tvs-root .tabs button { font-size:15px; }
#tvs-root .index .chips button,
#tvs-root .index .tally,
#tvs-root .index .reset { font-size:13px; }
#tvs-root .studiobar { font-size:14.5px; }
#tvs-root .studiobar code { font-size:14px; }
#tvs-root .panel > h2,
#tvs-root .seq > h2 { font-size:24px; }
#tvs-root .panel p { font-size:17px; }

      '<p><em>"I walk out after my session and I feel great. It has made a huge difference to the quality of my day. The stretch is the best half hour of my week."</em></p>'+
      '<p>She is not the only one. Two more, both from people who started with the same two-visit intro that is sitting open for you:</p>'+
      '<p><em>"Two sessions in and my hips feel unlocked for the first time in years. The screening found restrictions I never knew I had."</em></p>'+
      '<p><em>"After years at a desk my shoulders finally have room to move again. I left with a plan I actually understood."</em></p>'+
      '<p>That is the whole thing, {{first_name}}. Not a miracle. A real improvement, every week.</p>'+
      '<p class="cta"><a href="https://{LINK}">Book my first visit</a></p>'+ SIG,
     note:'Two emails merged into one. The old day 13 was proof with no story, the old day 15 was a story with no proof around it, and they landed 48 hours apart. The quotes are real Twin Cities member reviews from your own landing page, so they are honest for all four studios. Swap them for {STUDIO} clients as soon as you have a few; local names beat regional ones every time.'},
    {t:'task', when:'Day 16', title:'Final call - {{first_name}} {{last_name}}',
     text:"Third and last attempt before long-term nurture.\n\nOpening: \"Hi {{first_name}}, {STAFF} from The Vital Stretch in {STUDIO}. No sales pitch. You asked about the intro a couple weeks back and I just want to know if it is still on your list or if I should stop bugging you.\"\n\nThat question gets an honest answer more often than any other opener. Log what they say."},
    {t:'sms', when:'Day 17', nm:'Lost in the shuffle', text:"Hi {{first_name}}, {STAFF} again at The Vital Stretch. No pressure - just don't want you lost in the shuffle. Still want that intro?",
     note:'This replaces the old day 18 text, which asked the exact same question as day 3, fifteen days later: back, hips or shoulders. One asking is a conversation starter, two is a form.'},
    {t:'email', when:'Day 19', subj:'Who is actually stretching you',
     html:'<p>{{first_name}},</p>'+
      '<p>Worth knowing before you decide, because it is the part most people never ask about.</p>'+
      '<p>The Vital Stretch method was built at the crossroads of physical therapy and chiropractic work. Missy and Rob treated injuries for a combined 50+ years, one as a Physical Therapist and one as a Chiropractic Physician, and turned what they learned into the progressions we use on the table.</p>'+
      '<p>The standard for who gets to use those techniques is high on purpose. Our Vital Stretch Practitioners come in with degrees in kinesiology and exercise science, licenses in massage therapy, or top-level certifications through NASM, ISSA, ACE and ACSM. Then they complete our own training program before they touch a client.</p>'+
      '<p>You get one of them, one-on-one, for the full session. Not a group class, not a machine.</p>'+
      '<p class="cta"><a href="https://{LINK}">Book my two visits</a></p>'+
      '<p>This is my last note for a while. Your $29 intro stays open either way, and if now is not the time I will check back in a few months. If something changes before then, my number is below.</p>'+ SIG,
     note:'Every credential claim here is verbatim from the brand guide, so it needs no review. Do not add credentials or outcomes beyond what is written. The closing paragraph absorbed the old day 21 email, which repeated day 6 almost word for word; it still sets the expectation before the day 22 handoff to Long Term. Signature is the one with the phone number, since the close points at it.'},
    {t:'stage', when:'Day 22', title:'Update lead stage',
     text:"Set stage to: {SCODE} - Long Term\n\nThis is the handoff. {CODE}-20 triggers on it."}
  ]},

  {seq:'{CODE}-20 &middot; Long-term: stay in touch until ready',
   setup:{name:'{CODE}-20 Long-term nurture', trigger:'Lead assigned new stage = <b>{SCODE} - Long Term</b>', source:'For any lead source', once:'Yes', counters:'Appointment purchase, Appointment booking, Membership purchase, all scoped <b>after the customer is enrolled</b>',
    notes:'Momence has no recurring scheduler. Every step is a fixed offset from the day the Long Term stage lands, so a cadence written as "two emails a month, a text every quarter" cannot be built at all. It has to be a finite ladder, and this is it: sixteen steps across a year, twelve emails and four texts, dense through the first quarter and thinning after. All sixteen are written below, so there is nothing to draft. Three rotating slots carry it: <b>value</b> at steps 1, 5, 9 and 13, <b>proof</b> at 2, 6, 10 and 14, <b>offer</b> at 3, 7, 11 and 15, with a check-in text at 4, 8, 12 and 16. <b>Nothing here is seasonal, on purpose.</b> Leads enter Long Term on whatever day they happen to go cold, so step 7 lands in a different month for every person and a January or golf-season email would reach half of them in the wrong month. Seasonal pushes are broadcasts instead, sent on the real date to the Long Term segment, outside this sequence entirely. The counter scope is not optional here either: most people arriving from 60 and 84 already did both intro visits, so an all-time Appointment purchase counter matches their history and ejects them the second they enroll, and nothing in Momence tells you it happened.'},
   items:[
    {t:'email', when:'Day 7', subj:'Which one of these is you?', nm:'Value, the four pillars',
     html:'<p>{{first_name}},</p>'+
      '<p>Almost everyone who walks in is chasing one of four things. See which one sounds like you:</p>'+
      '<h4>Everyday Ease</h4><p>Desk workers, nurses, trades, anyone tired in a way sleep does not fix. Expand your range of motion, move lighter and looser, flex away the stress.</p>'+
      '<h4>Graceful Aging</h4><p>Stay active longer, stand tall, get down on the floor with the grandkids, and stay independent doing the things you love.</p>'+
      '<h4>Peak Performance</h4><p>Golfers, tennis players, lifters, runners. Push past previous limits, support your body at its best, and lower your injury risk.</p>'+
      '<h4>Injury Recovery</h4><p>Recover faster and more fully, regain your mobility, and prevent the next one.</p>'+
      '<p>The screening is the same for all four. What we do with the results is not.</p>'+
      '<p class="cta"><a href="https://{LINK}">Find out where I stand</a></p>'+ SIGP,
     note:'<b>Value slot, 1 of 4.</b> The value emails teach and never lean on the ask. Every claim here is straight from the brand pillars.'},
    {t:'email', when:'Day 21', subj:'Meet Norma', nm:'Proof, Norma',
     html:'<p>{{first_name}},</p>'+
      '<p>This one still makes us smile.</p>'+
      '<p>Norma added The Vital Stretch to her training for the Tokyo Marathon, working with us for months in the lead-up. A week after finishing Tokyo, she was offered a spot to run Boston.</p>'+
      '<p>For Boston she did not just feel ready. She said it was one of the best runs she had ever had, and she credited not cramping during the race to her weekly stretch routine with us.</p>'+
      '<p>Two world-major marathons a week apart, and the thing she pointed to was the standing weekly stretch.</p>'+
      '<p>Whether you are training for something big or just want your body to keep up with your life, {{first_name}}, recovery is where the magic actually happens.</p>'+
      '<p class="cta"><a href="https://{LINK}">Book my first visit</a></p>'+ SIGP,
     note:'<b>Proof slot, 1 of 4.</b> From the corporate testimonial library, cleared for use until we have our own. Replace all four proof emails with {STUDIO} clients as those stories arrive; local names beat regional ones every time.'},
    {t:'email', when:'Day 45', subj:'Still open, still $29', nm:'Offer, still open',
     html:'<p>{{first_name}},</p>'+
      '<p>Short one. The $29 intro is still sitting there, and nothing about it has changed: two 45-minute visits, a full movement screening, and a written mobility plan built on whatever we find.</p>'+
      '<p>The thing people tell us afterwards, almost word for word, is that they had been meaning to come in for months. Tight hips and a stiff back do not resolve on their own in the meantime. They just stop being noticeable, until something makes them noticeable again.</p>'+
      '<p>No membership, no package, nothing attached to it.</p>'+
      '<p class="cta"><a href="https://{LINK}">Book my two visits</a></p>'+
      '<p>And if the timing still is not right, that is genuinely fine. I am not going anywhere.</p>'+ SIGP,
     note:'<b>Offer slot, 1 of 4.</b> The offer emails are the only ones that lead with the ask, and all four are evergreen so they are true in any month.'},
    {t:'sms', when:'Day 60', nm:'Check-in, first', text:"{{first_name}}, {STAFF} at The Vital Stretch {STUDIO}. Not selling anything - just checking in. How's the body treating you? Reply STOP to opt out",
     note:'<b>Check-in slot, 1 of 4.</b> The only paid channel in this sequence, four texts across the year. It exists because a text still reaches the people who stopped opening email.'},
    {t:'email', when:'Day 80', subj:'Why sitting tightens your hips', nm:'Value, sitting and hips',
     html:'<p>{{first_name}},</p>'+
      '<p>Worth knowing if you spend most of the day in a chair.</p>'+
      '<p>Sitting holds your hip flexors in a shortened position for hours at a time. Muscles adapt to the position they are held in most, so they gradually settle there. That is not an injury. It is just what tissue does.</p>'+
      '<p>The part people rarely connect: when your hips stop extending properly, your lower back picks up the slack. So the ache turns up somewhere you were not even sitting on.</p>'+
      '<p>That is why the screening looks at how you move rather than where it hurts. The two are often in different places.</p>'+
      '<p class="cta"><a href="https://{LINK}">Book my screening</a></p>'+ SIGP,
     note:'<b>Value slot, 2 of 4.</b> The most-forwarded angle we have, because the desk-to-low-back link is something people feel but cannot explain.'},
    {t:'email', when:'Day 110', subj:'What people say after two visits', nm:'Proof, member quotes',
     html:'<p>{{first_name}},</p>'+
      '<p>Short one. I will let two of our members talk instead.</p>'+
      '<p><em>"Two sessions in and my hips feel unlocked for the first time in years. The screening found restrictions I never knew I had."</em></p>'+
      '<p><em>"After years at a desk my shoulders finally have room to move again. I left with a plan I actually understood."</em></p>'+
      '<p>Both of those came out of the same two-visit intro that is still open for you.</p>'+
      '<p class="cta"><a href="https://{LINK}">Book my two visits</a></p>'+ SIGP,
     note:'<b>Proof slot, 2 of 4.</b> Real Twin Cities member reviews from your own landing page, so they are honest for all four studios. These same two quotes also appear in {CODE}-10 at day 13; the gap here is about three months, which is far enough apart to be fine.'},
    {t:'email', when:'Day 140', subj:'What the screening actually finds', nm:'Offer, the screening',
     html:'<p>{{first_name}},</p>'+
      '<p>People assume the screening is a formality before the stretching starts. It is closer to the opposite. It is the part that decides what the stretching is for.</p>'+
      '<p>What it usually turns up:</p>'+
      '<ul><li>A hip or a shoulder that moves noticeably less on one side, which you cannot feel on your own because you have nothing to compare it against.</li>'+
      '<li>A joint quietly doing extra work to cover for a stiff one next to it.</li>'+
      '<li>The reason a stretch you have done for years has never actually changed anything.</li></ul>'+
      '<p>You leave with the findings written down in plain language, alongside the plan built from them.</p>'+
      '<p>$29 covers the screening and both sessions.</p>'+
      '<p class="cta"><a href="https://{LINK}">Book my two visits</a></p>'+ SIGP,
     note:'<b>Offer slot, 2 of 4.</b> Sells the screening rather than the stretch, which is the part that separates us from a massage appointment.'},
    {t:'sms', when:'Day 150', nm:'Check-in, second', text:"{{first_name}}, {STAFF} here at The Vital Stretch {STUDIO}. Still no pitch. How's everything moving these days? Reply STOP to opt out",
     note:'<b>Check-in slot, 2 of 4.</b> Deliberately worded differently from the day 60 text. The same message twice reads as an autoresponder.'},
    {t:'email', when:'Day 170', subj:'Why stretching yourself stops working', nm:'Value, assisted vs solo',
     html:'<p>{{first_name}},</p>'+
      '<p>A fair question we get a lot: if I already stretch on my own, what is this?</p>'+
      '<p>When you stretch yourself, the muscle you are trying to relax is partly the one holding you in position. Your body will not let you past a certain point, because it is protecting you from yourself. That ceiling is real, and most people reach it within a few weeks and then stay there for years.</p>'+
      '<p>Assisted stretching moves the work off you. The table, the straps and your practitioner hold the position, so your only job is to breathe and let go. That is what Active Isolated Stretching needs in order to work, and it is why two sessions can find range you have not had in a long time.</p>'+
      '<p>It is also why being tight is the reason to come in rather than the reason to wait.</p>'+
      '<p class="cta"><a href="https://{LINK}">Book my first visit</a></p>'+ SIGP,
     note:'<b>Value slot, 3 of 4.</b> Handles the single most common objection in the whole program, that they could just stretch at home.'},
    {t:'email', when:'Day 210', subj:'He never thought he would do the splits', nm:'Proof, Bob',
     html:'<p>{{first_name}},</p>'+
      '<p>A story that stuck with us.</p>'+
      '<p>Bob retired and decided to get serious about his health. His hamstrings were so tight they were limiting how he moved, the kind of stiffness that makes you feel older than you are.</p>'+
      '<p>He started coming in consistently and let us do the work.</p>'+
      '<p>He is dramatically more flexible now, he moves better in his workouts, and then there is the part he never saw coming: <strong>he can do the splits.</strong> He genuinely never imagined that was possible.</p>'+
      '<p>He did not start flexible, {{first_name}}. He started tight, a little skeptical, and worried about what was ahead. The flexibility was the result, not the requirement.</p>'+
      '<p class="cta"><a href="https://{LINK}">Book my first visit</a></p>'+ SIGP,
     note:'<b>Proof slot, 3 of 4.</b> Bob also appears in {CODE}-10 at day 4, roughly seven months earlier, with a plainer subject line. At that distance the repeat works in our favour.'},
    {t:'email', when:'Day 245', subj:'What the $29 actually gets you', nm:'Offer, what two visits gets you',
     html:'<p>{{first_name}},</p>'+
      '<p>Plainly, because this is easy to overthink.</p>'+
      '<h4>Visit 1, 45 minutes</h4><p>A full-body movement screening, then a guided assisted stretch with a Vital Stretch Practitioner. You stay fully clothed, in athletic wear. No oils, nothing to change into, nothing to bring.</p>'+
      '<h4>Between visits</h4><p>Your practitioner turns the screening into a written mobility plan built on what your body actually needs, not a template.</p>'+
      '<h4>Visit 2, 45 minutes</h4><p>We go through the findings, work the priority areas, and you leave with the plan written down.</p>'+
      '<p>Total, $29. No membership, no package, nothing that renews.</p>'+
      '<p class="cta"><a href="https://{LINK}">Book my two visits</a></p>'+ SIGP,
     note:'<b>Offer slot, 3 of 4.</b> The same structure as the day 0 email in {CODE}-10, which by this point they saw eight months ago and will not remember.'},
    {t:'sms', when:'Day 250', nm:'Check-in, third', text:"{{first_name}}, {STAFF} at The Vital Stretch {STUDIO}. Checking in - anything tight or nagging lately? Happy to take a look. Reply STOP to opt out",
     note:'<b>Check-in slot, 3 of 4.</b> The one text in the set that names a reason to reply.'},
    {t:'email', when:'Day 285', subj:'Recovery is where the work actually happens', nm:'Value, recovery',
     html:'<p>{{first_name}},</p>'+
      '<p>This applies whether you train hard or simply get through a busy week.</p>'+
      '<p>Effort creates the stimulus. Recovery is where your body adapts to it. Skip the second half and you collect the fatigue without much of the benefit, which is why people plateau while doing more, not less.</p>'+
      '<p>Mobility work is recovery you can put on a calendar. It is not the exciting half, and it is the half that keeps the rest possible.</p>'+
      '<p>Norma credited not cramping through the Boston Marathon to a standing weekly stretch. The same principle covers a long week at a desk.</p>'+
      '<p class="cta"><a href="https://{LINK}">Book my first visit</a></p>'+ SIGP,
     note:'<b>Value slot, 4 of 4.</b> Callback to the Norma email at day 21, which lands as a reference rather than a repeat this far out.'},
    {t:'email', when:'Day 330', subj:'The best half hour of her week', nm:'Proof, Paula',
     html:'<p>{{first_name}},</p>'+
      '<p>Paula plays a lot of tennis. Before she started coming in she noticed she was getting less limber and her body had started to ache. Not ideal when you are chasing a ball down the court.</p>'+
      '<p>Nothing dramatic. Just that creeping sense that her body was not doing what it always had.</p>'+
      '<p>She started coming in once a week. In her words:</p>'+
      '<p><em>"I walk out after my session and I feel great. It has made a huge difference to the quality of my day. The stretch is the best half hour of my week."</em></p>'+
      '<p>That is the whole thing, {{first_name}}. Not a miracle. A real improvement, every week.</p>'+
      '<p class="cta"><a href="https://{LINK}">Book my first visit</a></p>'+ SIGP,
    note:'<b>Proof slot, 4 of 4.</b> From the corporate testimonial library, cleared for use until we have a local {STUDIO} client story.'},
    {t:'email', when:'Day 365', subj:'A year of meaning to come in', nm:'Offer, one year on',
     html:'<p>{{first_name}},</p>'+
      '<p>It has been about a year since you first asked about us.</p>'+
      '<p>No guilt in that. Life fills up, and a stiff back rarely feels urgent enough to reach the top of a list. It just sits there, quietly becoming normal.</p>'+
      '<p>The $29 intro has not changed and it has not expired. Two 45-minute visits, a screening, a written plan.</p>'+
      '<p class="cta"><a href="https://{LINK}">Book my two visits</a></p>'+
      '<p>If you would rather I stopped, reply <strong>"not now"</strong> and I will. Otherwise I will check in now and then, because the people who finally come in almost always say the same thing about wishing they had done it sooner.</p>'+ SIG,
     note:'<b>Offer slot, 4 of 4.</b> The one-year mark, and the second opt-out valve in the program. A "not now" reply goes to the Not Interested stage, which is what keeps people from reaching for STOP instead.'},
    {t:'sms', when:'Day 370', nm:'Check-in, fourth', text:"{{first_name}}, {STAFF} at The Vital Stretch {STUDIO}. Been about a year since you reached out. Still here if you want in. Reply STOP to opt out",
     note:'<b>Check-in slot, 4 of 4, and the last step in the sequence.</b> After this they stay on the Long Term stage and only hear from the seasonal broadcasts. If you want a second year, duplicate the sequence and trigger it from a new stage rather than extending this one past 370 days.'}
   ]},

  {seq:'{CODE}-30 &middot; Before every visit: remind',
   setup:{name:'{CODE}-30 Before every visit', trigger:'Appointment visit, <b>every visit</b>, enrolled <b>On booking</b>', source:'For any lead source', once:'<b>No</b> (must fire on every appointment)', counters:'Appointment cancellation', notes:'Use the Appointment visit trigger, not Appointment booking. Only Appointment visit carries the On booking vs On check-in choice, and On booking is what lets you place steps before the visit. This is also the only sequence where the <b>Trigger action even if lead is enrolled after the action</b> checkbox does anything, because it is the only one with steps scheduled before the trigger; each step below states its own setting, and they are not the same. This runs on both intro visits and every session after. The immediate intro booking email is in 31 because its preparation details belong only to visit 1.'},
   items:[
    {t:'email', when:'24 hours before', subj:'See you tomorrow, {{first_name}}',
     late:'<b>Unticked, deliberately.</b> Ticking it fires this at anyone who books inside 24 hours, and the subject and the first line both say <em>tomorrow</em> when they are actually in today. Wrong is worse than absent, and the booking confirmation and 2-hour text already cover them.',
     html:'<p>{{first_name}},</p>'+ 
      '<p>Quick reminder that you are in tomorrow at <strong>{ADDR}</strong>, {LMS}.</p>'+ 
      '<p>Athletic clothes, arrive a few minutes early, and that is it.</p>'+ 
      '<p>Need to move it? Reply here or call {PHONE}.</p>'+ SIGP,
     note:'This is the one step in the build where the enrolled-after box has to stay unticked. If you would rather it reach same-day bookers, the fix is the copy, not the checkbox: strip both uses of "tomorrow" so the email is true whenever it lands, then tick the box.'},
    {t:'sms', when:'2 hours before', nm:'Two hours before', text:"{{first_name}}, {STAFF} here - you're in later today. We're {LMS}. Athletic clothes, come a few min early. Need to move it? Reply here.",
     late:'<b>Ticked.</b> Someone who books inside two hours gets it immediately, and every word still holds: they are in later today, and arriving a few minutes early still applies.',
     note:'No day or clock time named anywhere, so nothing needs editing per send. The Momence booking confirmation carries the exact time. The landmark is doing real work: "I could not find it" is a quiet share of every no-show.'}
  ]},

  {seq:'{CODE}-31 &middot; Intro booking: prepare for visit 1',
   setup:{name:'{CODE}-31 Intro booking email', trigger:'Appointment visit, <b>visit 1</b>, enrolled <b>On booking</b>', source:'For any lead source', once:'Yes', counters:'none', notes:'This is separate from 30 because the movement screening, intake form and first-visit preparation apply only to the intro booking. Use Appointment visit set to visit 1 and enroll On booking so the email sends as soon as the first visit is booked. Enroll once prevents duplicate welcome emails if the appointment is moved.'},
   items:[
    {t:'email', when:'Immediately on booking', subj:'Your Vital Stretch visit is booked', photo:'welcome',
     late:'<b>Unticked.</b> This one is due the moment they enroll, so it can never be overdue and the box does nothing either way.',
     html:'<p>{{first_name}},</p>'+
      '<p>Your visit is booked. Your appointment confirmation contains the date and time.</p>'+ 
      '<p>We are at <strong>{ADDR}, {STUDIO}</strong>, {LML}. Parking is right out front.</p>'+
      '<h4>Your first visit</h4>'+ 
      '<p>If this is your first visit, the 45-minute appointment includes a full-body movement screening followed by a guided, one-on-one assisted stretch. Your practitioner uses the screening and your goals to begin shaping a mobility plan around how you move.</p>'+ 
      '<p>You remain fully clothed throughout the session. There are no oils and nothing to change into.</p>'+ 
      '<h4>Before you arrive</h4>'+ 
      '<ul><li><strong>Clothing:</strong> Athletic clothes and socks that allow you to move comfortably.</li>'+ 
      '<li><strong>Arrival:</strong> A few minutes early leaves time to get settled before the screening.</li>'+ 
      '<li><strong>App:</strong> The Vital Stretch app is available in your app store. Sign-in uses the email address on this booking.</li></ul>'+ 
      '<p>For a first visit, complete the brief intake form before the appointment:</p>'+ 
      '<p class="cta"><a href="https://momence.com/dashboard/intake-form/Q0X61eO8np">Complete the intake form</a></p>'+ 
      '<h4>Appointment changes</h4>'+ 
      '<p>Changes made with less than 12 hours\' notice result in the session being forfeited. Reply to this email or call {PHONE} to change the appointment.</p>'+ SIG},
  ]},

  {seq:'{CODE}-40 &middot; No-show: one warm rescue',
    setup:{name:'{CODE}-40 No-show rescue', trigger:'Lead assigned new stage = <b>{SCODE} - No Show</b>', source:'For any lead source', once:'Yes', counters:'Appointment booking, Appointment purchase, Membership purchase, all scoped <b>after the customer is enrolled</b>', notes:'This has to be its own sequence. The obvious shortcut, resetting a missed lead back to the Intro Nurture stage so 10 re-fires, cannot work: 10 is enrolled-once, so a lead who already ran through it is never enrolled again and the rescue silently never sends. A separate stage and a separate sequence is the only version that fires. Scope the counters after enrollment or the intro appointment they already booked and missed will match an all-time counter and drop them on arrival. Front desk sets the {SCODE} - No Show stage. If your account turns out to fire a native no-show trigger on appointment services, swap that in for the stage trigger and skip the stage entirely.'},
   items:[
    {t:'sms', when:'Day 0, +90 minutes', nm:'No-show rescue, same day', text:"{{first_name}}, {STAFF} at The Vital Stretch {STUDIO}. We had you down today and missed you - no problem, life happens. Want me to find you a new time?",
     note:'Ninety minutes is deliberate: long enough that it does not read as a scolding, short enough that the day is still fresh. No guilt, one goal, a reply.'},
    {t:'task', when:'Day 0, +2 hours', title:'Rebook {{first_name}} {{last_name}}',
     text:"Call to rebook. Warm, no guilt, assume something came up.\n\nOffer two specific times rather than asking them to pick. Two options instead of \"when works for you\" measurably raises rebook rate because it removes a decision."},
    {t:'sms', when:'Day 4', nm:'No-show rescue, day 4', text:"{{first_name}}, still happy to get you in. Want me to grab you a spot this week? - {STAFF}"},
    {t:'stage', when:'Day 7', title:'Update lead stage', nm:'Unrescued to Long Term',
    text:"If they still have not rebooked, set stage to: {SCODE} - Long Term\n\nSame drain as every other dead end. Someone who booked once and missed is still a warmer lead than one who never booked at all, so do not let them fall off a list."}
   ]},

  {seq:'{CODE}-50 &middot; After visit 1: recap and book visit 2',
   setup:{name:'{CODE}-50 After visit 1', trigger:'Appointment visit, specific visit number <b>1</b>, enrolled <b>On check-in</b>', source:'For any lead source', once:'Yes', counters:'none on the sequence; an internal gate handles the nudge', notes:'There is no Appointment check-in trigger in Momence. Use Appointment visit, set Trigger on a specific number of visits to 1, and enroll On check-in so it fires when they actually show. The count is by appointment, so for a fresh intro lead visit 1 is their first appointment; confirm the behavior for anyone who had a prior appointment. The recap email goes to everyone. A true/false gate then decides the nudge: if Appointment booking since enrollment is true, they already scheduled visit 2 at the desk and the nudge is skipped. This replaces the old split between a recap and a separate backstop.'},
   items:[
    {t:'email', when:'+3 hours, everyone', subj:'What we found today',
     html:'<p>{{first_name}},</p>'+
      '<p>Good to meet you today.</p>'+
      '<p>Here is what happens next. Your VSP is taking the screening and today\'s session and building out your mobility plan. We go through it at your second visit, work the priority areas we found, and you leave with it written down.</p>'+
      '<p><strong>That second visit is already paid for.</strong> The $29 covered both. The screening tells us where you are, and visit 2 is where you actually get the plan.</p>'+
      '<p>If we got it on the calendar before you left, you are all set and you will get a reminder. If not, grab a time here:</p>'+
      '<p class="cta"><a href="https://{LINK}">Book my second visit</a></p>'+ SIGP},
    {t:'cond', when:'Day 2', nm:'Visit 2 booking gate',
     how:'This one is a gate, not an action. Click <b>Add Step &gt; Add Condition</b>, not Add Action, and give it the <b>Action name</b> above. Set <b>Timing</b> to match the <b>Timing</b> line above, choose the condition below, and place the two steps that follow on the <b>False</b> branch.',
     text:"Condition: Appointment booking (since enrollment) = false\n\nThis gates the two steps below. Anyone who booked visit 2 at the desk passes the gate as true and never gets the nudge. Only the desk-handoff misses fall through."},
    {t:'sms', when:'Day 3, only if not booked', nm:'Prepaid visit 2 nudge', text:"{{first_name}}, your 2nd session is paid for already - that's the one where you get your plan. Want me to grab you a time this week? - {STAFF}"},
    {t:'task', when:'Day 6, only if not booked', title:'Prepaid second visit - {{first_name}} {{last_name}}',
     text:"Call. The second visit is prepaid and unused. This is the highest-value call on the board.\n\nIf this task shows up often, the fix is a practitioner conversation, not more automation. Visit 2 is supposed to be booked on the table before they get up."}
  ]},

  {seq:'{CODE}-60 &middot; After visit 2: make the offer',
   setup:{name:'{CODE}-60 After visit 2', trigger:'Appointment visit, specific visit number <b>2</b>, enrolled <b>On check-in</b>', source:'For any lead source', once:'Yes', counters:'Membership purchase, Appointment booking, both scoped <b>after the customer is enrolled</b>', notes:'Same trigger as 50, Appointment visit enrolled On check-in, but set Trigger on a specific number of visits to 2 so it fires after the second intro session. The counters are what make this sequence work and also what limits it: a counter removes someone from the sequence, it does not gate a step, so nothing after the moment of conversion can live here. The welcome and the review ask are therefore in 65, not here. All this sequence does is ask, ask once more, put a call on the board, and drop the people who did not convert into Long Term. A booking past visit 2 is the conversion signal, since nobody books a third session and then declines to pay.'},
   items:[
    {t:'email', when:'Day of visit 2, +3 hours', subj:'Your plan, and what comes next',
     html:'<p>{{first_name}},</p>'+
      '<p>Your plan is in your hands. Here is the honest part.</p>'+
      '<p>What you felt over these two sessions is real, and it is also temporary if we stop here. Mobility responds to consistency the same way strength does. The people who tell me this changed things for them are the ones who made it a weekly rhythm, and that started exactly where you are right now.</p>'+
      '<p>That is the whole pitch. No urgency, no discount clock.</p>'+
      '<p>If you want to keep going, I will walk you through the options and we will pick the one that fits how often you will realistically come in. Reply here or call {PHONE}.</p>'+ SIG},
    {t:'email', when:'Day 3, if not converted', subj:'One question',
     html:'<p>{{first_name}},</p>'+
      '<p>One question and I will leave you alone: <strong>what is stopping you?</strong></p>'+
      '<p>Price, schedule, not sure it is worth it, or just have not gotten to it? Whatever the answer is, tell me and I will give you a straight response. If the answer is "it is not for me," that is a fine answer too.</p>'+ SIGP},
    {t:'task', when:'Day 6, if not converted', title:'Conversion call - {{first_name}} {{last_name}}',
     text:"They have had the full experience and a written plan. This is the call the whole program was built to set up.\n\nCompare what they said about frequency against the options and recommend one out loud. Do not present a menu and wait."},
    {t:'stage', when:'Day 10, if not converted', title:'Update lead stage',
    text:"Set stage to: {SCODE} - Long Term\n\nSomeone who did both visits and did not convert is a far better long-term lead than someone who never came in. Do not let them fall off a list."}
  ]},

  {seq:'{CODE}-65 &middot; New member: welcome, then ask for the review',
  setup:{name:'{CODE}-65 New member welcome', trigger:'Membership purchase', source:'For any lead source', once:'Yes', counters:'none, see the note', notes:'These two emails used to sit at the end of 60 and could never have sent. A counter condition removes a person from a sequence rather than gating one step inside it, so the Membership purchase counter on 60 ejects a convert before either message reaches them. They need their own trigger, which also turns two impossible timings, "when they book a third" and "two weeks after converting," into ordinary offsets of 1 and 14 days. If your trigger list has no membership-purchase trigger, have front desk set a {SCODE} - Member stage at the point of sale and trigger on that stage instead; the rest of the sequence is unchanged. No counter conditions: none of the five available types describes someone who cancels inside the first two weeks, so on the rare occasion that happens, stop the sequence by hand.'},
   items:[
    {t:'email', when:'Day 1', subj:'Glad you are staying, {{first_name}}', nm:'New member welcome',
     html:'<p>{{first_name}},</p>'+
      '<p>Quick note to say I am glad you are sticking with it.</p>'+
      '<p>One thing worth knowing now rather than in three months: consistency beats intensity here every time. Someone who comes every week at a moderate stretch gets further than someone who comes hard twice and disappears. Your plan assumes a rhythm.</p>'+
      '<p>If your schedule shifts, tell me before you start missing. There is almost always a time that works and I would rather move you than lose you.</p>'+ SIG,
     note:'A day of offset, not zero, so this does not land in the same minute as the Momence purchase receipt.'},
    {t:'email', when:'Day 14', subj:'A favor', nm:'Review ask',
     html:'<p>{{first_name}},</p>'+
      '<p>Small ask and then I will stop. If the last few weeks have been worth it, would you leave us a Google review? Reviews are most of how people nearby decide whether to walk in.</p>'+
      '<p class="cta"><a href="https://{RLINK}">Leave a review</a></p>'+
      '<p>Takes about a minute. Thank you either way.</p>'+ SIGP,
     note:'Email only, never SMS. Asking for a favor by paid text reads wrong. Two weeks in is deliberate: they have had a few post-intro sessions, which is when the difference is most obvious.'}
   ]},

  {seq:'{CODE}-70 &middot; Gone quiet: win the member back',
   setup:{name:'{CODE}-70 Winback', trigger:'Win-back (based on the last class or appointment visit), status gates at 14 and 28 days', source:'For any lead source', once:'Yes', counters:'Appointment booking and Membership purchase, both scoped <b>after the customer is enrolled</b>', notes:'Search the trigger box for "win" and choose Win-back, based on the last class or appointment visit a customer made. At each touch, use Customer has active membership to split active and inactive customers. An active member exits when they book an appointment; an inactive customer exits when they purchase a membership. Momence applies counters to the whole sequence rather than one branch, so add both counters after enrollment. That also safely removes the less common crossover cases: an inactive customer who books or an active customer who changes membership. Never use all-time here, because prior bookings and purchases would eject everyone on arrival. The complimentary infrared sauna session is a comeback incentive, limited to adults 18+ after the required sauna agreement and screening.'},
   items:[
    {t:'cond', when:'14 days since last visit', nm:'14-day active membership gate',
     how:'Click <b>Add Step &gt; Add Condition</b> and choose <b>Customer has active membership</b>. Put the active-member email on the <b>True</b> branch and the inactive-customer email on the <b>False</b> branch, then merge both branches before the 28-day gate.',
     text:"Condition: Customer has active membership = true\n\nTrue: send the active-member comeback email.\nFalse: send the inactive-customer restart email.\nMerge both branches before the 28-day condition."},
    {t:'email', when:'Immediately on TRUE branch of 14-day gate', subj:'Your next stretch comes with a sauna session on us', nm:'Active member sauna comeback',
     html:'<p>{{first_name}},</p>'+
      '<p>{STAFF} here. It has been a couple of weeks since your last stretch, so I wanted to give you a good reason to get the next one on the calendar.</p>'+ 
      '<p><strong>Book your next stretch and your next infrared sauna session is on us.</strong> Use code <strong>SAUNAONUS</strong> at checkout, or give the code to your practitioner and they can apply it for you.</p>'+ SAUNA_COMEBACK +
      '<p class="cta"><a href="https://{LINK}">Book my next stretch</a></p>'+ 
      '<p>If your schedule changed or something else is getting in the way, reply and tell me. We will help find a time that works.</p>'+ 
      '<p class="sig">Complimentary sauna session is available to adults 18+ after completing the required sauna agreement and screening.</p>'+ SIG},
    {t:'email', when:'Immediately on FALSE branch of 14-day gate', subj:'Come back with a sauna session on us', nm:'Inactive customer sauna restart',
     html:'<p>{{first_name}},</p>'+
      '<p>{STAFF} here. It has been a while since we have seen you, and getting back into your routine should feel easy.</p>'+ 
      '<p><strong>Restart your stretch membership and your first infrared sauna session back is on us.</strong> Use code <strong>SAUNAONUS</strong> at checkout, or give the code to your practitioner and they can apply it for you. Reply to this email or call {PHONE} if you need help choosing the membership that fits your schedule now.</p>'+ SAUNA_COMEBACK +
      '<p>No pressure and no starting over. We already know you and can pick up from where you left off.</p>'+ 
      '<p class="sig">Complimentary sauna session is available to adults 18+ after completing the required sauna agreement and screening.</p>'+ SIG},
    {t:'cond', when:'28 days since last visit', nm:'28-day active membership gate',
     how:'After the 14-day branches merge, click <b>Add Step &gt; Add Condition</b> and choose <b>Customer has active membership</b>. Put the active-member SMS on the <b>True</b> branch and the inactive-customer SMS on the <b>False</b> branch.',
     text:"Condition: Customer has active membership = true\n\nTrue: send the active-member booking SMS.\nFalse: send the inactive-customer restart SMS.\nBoth branches end after their SMS."},
    {t:'sms', when:'Immediately on TRUE branch of 28-day gate', nm:'Active member sauna reminder', text:"{{first_name}}, use SAUNAONUS at checkout for a free sauna when you book: {LINK} Or ask your practitioner. 18+ only. - {STAFF} STOP to opt out"},
    {t:'sms', when:'Immediately on FALSE branch of 28-day gate', nm:'Inactive customer sauna reminder', text:"{{first_name}}, restart your membership and get a free sauna. Use SAUNAONUS at checkout or ask your practitioner. 18+ only. - {STAFF} STOP to opt out"}
  ]},

  {seq:'{CODE}-80 &middot; Cancelled: one honest save attempt',
   setup:{name:'{CODE}-80 Save the member', trigger:'Subscription cancellation', source:'For any lead source', once:'Yes', counters:'Membership purchase, scoped <b>after the customer is enrolled</b>, in case they resubscribe', notes:'Momence fires this the moment a cancellation processes, and almost nobody builds against it. A save attempt costs one email and one call and is worth more than five new leads. The counter scope is the whole ballgame: every person entering this sequence just cancelled a membership they bought, so an all-time Membership purchase counter matches that purchase and drops them before the first email sends. Scope it after enrollment and it only catches a genuine resubscribe.'},
   items:[
    {t:'email', when:'Immediately', subj:'Before you go, one question',
     html:'<p>{{first_name}},</p>'+
      '<p>Your membership is cancelled. That part is done and I am not going to make it awkward.</p>'+
      '<p>One question though, because it genuinely helps us: <strong>what was it?</strong></p>'+
      '<p>Price, schedule, a practitioner who was not the right fit, results that did not land, or just life getting in the way? Any answer is useful, including a blunt one.</p>'+
      '<p>And if it was frequency or cost rather than the stretching itself, tell me. There is almost always a smaller option that fits, and I would rather put you on that than lose you entirely.</p>'+ SIG},
    {t:'task', when:'Day 1', title:'Save call - {{first_name}} {{last_name}}',
     text:"One call. Warm, curious, no pitch. The goal is to learn why, not to reverse it.\n\nFrequency or cost, offer the smaller option. Practitioner fit, offer a different one. Moving or injured, thank them and let them go cleanly.\n\nLog the reason. Cancellation reasons are the most useful data your studio produces and nobody ever writes them down."},
    {t:'stage', when:'Day 3', title:'Update lead stage',
    text:"If not saved, set stage to: {SCODE} - Long Term\n\nA former member belongs in long-term nurture, not a dead list. They already know exactly what they are missing."}
  ]},

  {seq:'{CODE}-82 &middot; Frozen: keep the pause from becoming an exit',
   setup:{name:'{CODE}-82 Freeze save', trigger:'Membership freeze', source:'For any lead source', once:'Yes', counters:'Membership purchase, Appointment booking, both scoped <b>after the customer is enrolled</b>', notes:'80 only catches an active cancel. A freeze is the quieter exit: life got busy and the membership goes on hold, and a good share never come back. This is a warm, low-pressure touch that keeps the door open. Scope both counters after enrollment, because the frozen membership itself is an all-time membership purchase and would eject everyone instantly. Scoped right, anyone who books or restarts drops out.'},
   items:[
    {t:'email', when:'Immediately', subj:'Your membership is paused, not gone', nm:'Freeze reassurance',
     html:'<p>{{first_name}},</p>'+
      '<p>{STAFF} here. Your membership is on hold, and that is completely fine. Life gets full, and the whole point of a freeze is that you do not lose anything while it does.</p>'+
      '<p>Your plan and your progress are saved exactly where you left them. When you are ready, one message to me and you are back on the table, no restart and no catch-up.</p>'+
      '<p>And if something specific pushed you to pause, schedule, cost, a session that did not land, tell me. There is usually a way to work around it, and I would rather adjust than lose you.</p>'+ SIG},
    {t:'task', when:'Day 2', title:'Freeze check-in call - {{first_name}} {{last_name}}', nm:'Freeze check-in call',
     text:"One warm call. Not a save pitch, a check-in. Assume life got busy, not that they are unhappy.\n\nAsk what changed. If it is schedule, offer a lighter frequency. If it is cost, name the smaller option. If it is a fit issue, offer a different practitioner. Log the reason either way.\n\nDo not push a return date. The goal is to be the easy, warm choice when they are ready."},
    {t:'email', when:'Day 21', subj:'Still here when you are ready', nm:'Freeze, ready when you are',
     html:'<p>{{first_name}},</p>'+
      '<p>No agenda here, just a quick note so you know the light is still on.</p>'+
      '<p>Whenever the timing is right, your spot and your plan are waiting. Reply to this and I will get you back in around whatever your week looks like now.</p>'+ SIGP}
   ]},

  {seq:'{CODE}-84 &middot; Lapsed: win back a membership that quietly ran out',
   setup:{name:'{CODE}-84 Expiration win-back', trigger:'Membership expiration', source:'For any lead source', once:'Yes', counters:'Membership purchase, Appointment booking, both scoped <b>after the customer is enrolled</b>', notes:'The membership 80 never sees: a non-renewing plan or a credit pack that simply ran out, with no cancel button ever pressed. Same job as 80, a warm save, aimed at people who lapsed by default rather than by decision. Scope both counters after enrollment, since the expired membership is itself an all-time purchase and would drop every person on arrival. Scoped right, the counters drop anyone who restarts. One overlap to watch: expiration also fires when a cancelled sub finally lapses, so someone who already went through 80 could land here weeks later. If that happens, have 80 add a tag like post-cancel and set this counter to Customer has tag as well, to drop them.'},
   items:[
    {t:'email', when:'Immediately', subj:'Your membership just wrapped up', nm:'Expiration, wrapped up',
     html:'<p>{{first_name}},</p>'+
      '<p>{STAFF} here. Your membership has run its course and just ended. If that was the plan, no problem at all, and thank you for the time on the table with us.</p>'+
      '<p>If it slipped by without you really deciding, that happens more than you would think, and picking back up is easy. One session and the looser, lighter feeling comes right back.</p>'+
      '<p class="cta"><a href="https://{LINK}">Start back up</a></p>'+
      '<p>Not sure it is the right time? Reply and tell me what changed. There is usually an option that fits better than the one you were on.</p>'+ SIG},
    {t:'task', when:'Day 2', title:'Win-back call - {{first_name}} {{last_name}}', nm:'Expiration win-back call',
     text:"Call, ideally from their own practitioner, so it feels known. Warm, curious, no hard sell.\n\nFind out whether the lapse was intentional. If not, make restarting effortless and book the next session live. If it was cost or frequency, offer the option that fits. Log the reason."},
    {t:'email', when:'Day 10', subj:'The door is open', nm:'Expiration, door is open',
     html:'<p>{{first_name}},</p>'+
      '<p>Last note from me for now.</p>'+
      '<p>Your body does not hold the progress on its own, and a few weeks off is when the tightness starts creeping back. Getting in now is a lot easier than starting over later.</p>'+
      '<p class="cta"><a href="https://{LINK}">Book a session</a></p>'+
      '<p>If now is not the time, that is fine. I will check back in a while.</p>'+ SIGP},
    {t:'stage', when:'Day 14', title:'Update lead stage', nm:'Lapsed to Long Term',
    text:"If not restarted, set stage to: {SCODE} - Long Term\n\nA lapsed member is a strong long-term lead. They know exactly what the stretch feels like. Do not drop them off a list."}
   ]}
  ];

    {t:'email', when:'Day 0, +5 minutes', subj:'We are now open, and your $29 intro is ready',

      '<p>{STAFF} here from The Vital Stretch {STUDIO}. We are open, {LML}, and I am booking intro appointments now.</p>'+

  var UNASSIGNED = {id:'unassigned', seq:'Unassigned lead &middot; Twin Cities shared flow',
    setup:{name:'TC - Unassigned lead', trigger:'Lead assigned new stage = <b>TC - Unassigned</b>', source:'Generic Twin Cities and manual lead sources only', once:'Yes', counters:'Appointment booking, Appointment purchase and Membership purchase, all scoped <b>all-time</b>', notes:'There is no per-studio catch-all. A lead who has not selected a location cannot safely receive a Minnetonka, St Louis Park, Eden Prairie or Savage stage. Create one shared stage named TC - Unassigned and make it the default stage for generic Twin Cities and manual lead sources. Studio-specific sources continue to default directly to their own Intro Nurture stage. The abandoned-checkout source remains associated only with the separate abandoned-cart flow below. This short sequence follows the same generic structure as abandoned cart while avoiding a duplicate seven-touch campaign. If the lead replies with a studio, front desk sets that studio\'s Intro Nurture stage. A booking or purchase exits this flow automatically.'},
    items:[
      {t:'sms', when:'Day 0, immediately', nm:'Choose a Twin Cities studio', text:'Hi {{first_name}}, The Vital Stretch Twin Cities. Which location works best: Minnetonka, St Louis Park, Eden Prairie or Savage? Reply STOP to opt out',
       note:'One shared first touch. It does not invent a location or sender. A reply identifies the studio, and front desk then sets that studio\'s Intro Nurture stage.'},

        '<p>No membership or package is required. The offer is available to first-time guests, one per person.</p>'+ 
        TC_BOOKING+
        '<p>Questions about the intro or any location? Reply directly to this email.</p>'+TC_SIG},
      {t:'sms', when:'Day 2', nm:'Which studio works best', text:'Hi {{first_name}}, which studio works best: Minnetonka, St Louis Park, Eden Prairie or Savage? Reply with the location. Reply STOP to opt out',
       note:'The follow-up still asks only for the missing routing fact. It does not assign a studio or claim to know where the lead lives.'},
      {t:'email', when:'Day 5', nm:'Four Twin Cities studios', subj:'Four Twin Cities studios, one $29 intro', photo:'logo',

        '<p>The Vital Stretch has four Twin Cities studios: Minnetonka, St. Louis Park, Eden Prairie and Savage.</p>'+

        '<p>No membership or package is required. The offer is available to first-time guests, one per person.</p>'+ 
        TC_BOOKING+
        '<p>Questions about the intro or any location? Reply directly to this email.</p>'+TC_SIG}
    ]};

  var ABANDONED = {id:'abandoned', seq:'Abandoned cart &middot; Twin Cities shared flow',
    setup:{name:'TC - Abandoned cart', trigger:'New lead record created', source:'<b>Abandoned checkout lead source only</b>, shared across Twin Cities', once:'Yes', counters:'Appointment booking, Appointment purchase and Membership purchase, all scoped <b>all-time</b>', notes:'This is one shared Twin Cities sequence, not four studio sequences. The checkout record does not identify a preferred studio, so every email presents all four booking links and every message uses the Twin Cities team identity. Associate only the abandoned-checkout source with this sequence. Do not attach that source to a studio router or studio nurture sequence, or the same lead can enter overlapping flows. The counter conditions remove anyone who books or purchases after abandoning checkout.'},
    items:[
      {t:'sms', when:'Day 0, +15 minutes', nm:'Questions before booking', text:'Hi {{first_name}}, this is The Vital Stretch Twin Cities. Questions about the $29 intro or assisted stretching? Reply here. Reply STOP to opt out.',
       note:'Replaces the emoji-heavy "checking us out" message. It identifies the sender, names the offer and gives the person one clear reason to reply.'},
      {t:'email', when:'Day 1', nm:'What the intro includes', subj:'What your $29 Vital Stretch intro includes', photo:'logo',
       html:'<p>Hi {{first_name}},</p>'+ 
        '<p>The Vital Stretch provides one-on-one assisted stretching built around how your body moves. You remain fully clothed in athletic wear while a trained and certified practitioner works with you from start to finish.</p>'+ 
        '<p>It is not a group class, massage or physical therapy. No referral is needed.</p>'+ 
        '<h4>Your $29 Twin Cities intro</h4>'+ 
        '<p>The intro includes two 45-minute visits:</p>'+ 
        '<ul><li><strong>Visit 1:</strong> Full-body movement screening and guided assisted stretch.</li>'+ 
        '<li><strong>Between visits:</strong> A personalized mobility plan based on your screening and first stretch.</li>'+ 
        '<li><strong>Visit 2:</strong> Findings review and targeted stretching for priority areas.</li>'+ 
        '<li><strong>Take-home:</strong> A written summary and things you can do on your own.</li></ul>'+ 
        '<p>The $29 covers both visits. No membership or package is required. You book the first visit, and your practitioner schedules the second after that session.</p>'+ 
        TC_BOOKING+
        '<p>Questions about assisted stretching or the intro? Reply directly to this email.</p>'+ 
        TC_SIG+
        '<p class="sig">Intro offer is available to first-time guests, one per person.</p>'},
      {t:'sms', when:'Day 2', nm:'What the intro includes', text:'Hi {{first_name}}, the $29 intro includes two 45-min visits: a movement screen, assisted stretch and mobility plan. Questions? Reply here. Reply STOP to opt out.'},
      {t:'email', when:'Day 3', nm:'What assisted stretching is like', subj:'What assisted stretching is like', photo:'logo',
       html:'<p>Hi {{first_name}},</p>'+ 
        '<p>Assisted stretching is one-on-one and hands-on. A trained and certified practitioner moves you through stretches that are difficult to reach alone.</p>'+ 
        '<ul><li>You remain fully clothed in athletic wear.</li>'+ 
        '<li>There are no oils and nothing to change into.</li>'+ 
        '<li>It is not a group class, massage or physical therapy.</li>'+ 
        '<li>No referral is needed.</li></ul>'+ 
        '<p>Your first intro visit combines a full-body movement screening with a guided assisted stretch. The second visit reviews the findings and focuses on priority areas.</p>'+ 
        TC_BOOKING+
        '<p>Questions about the process? Reply directly to this email.</p>'+TC_SIG},
      {t:'sms', when:'Day 4', nm:'One-on-one and fully clothed', text:'Hi {{first_name}}, sessions are one-on-one, fully clothed and built around how you move. No referral is needed. Questions? Reply here. Reply STOP to opt out.'},
      {t:'email', when:'Day 7', nm:'Choose a Twin Cities studio', subj:'Choose a studio for your $29 intro', photo:'logo',
       html:'<p>Hi {{first_name}},</p>'+ 
        '<p>The $29 Twin Cities intro covers two 45-minute, one-on-one visits. The first includes a movement screening and assisted stretch. The second reviews the findings and targets priority areas.</p>'+ 
        '<p>No membership or package is required. The offer is available to first-time guests, one per person.</p>'+ 
        TC_BOOKING+
        '<p>Questions about the intro or any location? Reply directly to this email.</p>'+TC_SIG},
      {t:'sms', when:'Day 7', nm:'Promo follow-up, disabled', enabled:false, text:'Hi {{first_name}}, your $29 intro covers two 45-min visits at your choice of four Twin Cities studios. Questions? Reply here. Reply STOP to opt out.',
       note:'<b>Leave this action disabled.</b> The day-7 email already presents all four booking choices on the same offset. The card remains here because it is part of the out-of-box Momence flow shown in the account.'}
    ]};

  var CUSTOM_KEY = 'tvs-nurture-custom-v1';
  var custom = (function(){ try { return JSON.parse(localStorage.getItem(CUSTOM_KEY)) || {}; } catch(e){ return {}; } })();
  function saveCustom(){ try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(custom)); } catch(e){} }

  function checkField(k, v){
    v = String(v==null?'':v).trim();
    if (!v) return {c:'warn', m:'Empty. Every message that uses this field ships with a hole in it.'};
    switch(k){
      case 'code':
        return /^[A-Za-z][A-Za-z0-9]{1,5}$/.test(v)
          ? {c:'ok', m:'Sequences read '+v+'-10, stages read '+v.toUpperCase()+' - Intro Nurture.'}
          : {c:'bad', m:'Letters and digits only, two to six characters. No spaces, dashes or punctuation.'};
      case 'studio':
        return {c:'ok', m:'"The Vital Stretch '+v+'" is '+(18+v.length)+' characters of every text that names the studio.'};
      case 'phone':
        var d = v.replace(/\D/g,'').length;
        return d===10 ? {c:'ok', m:'Ten digits. It prints exactly as typed, so match the format the other studios use.'}
                      : {c:'bad', m:'Ten digits expected, found '+d+'.'};
      case 'email':
        return /^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(v) ? {c:'ok', m:'Reference only, never pasted into a message.'}
                                                       : {c:'bad', m:'That is not an address.'};
      case 'link': case 'rlink':
        if (/^https?:\/\//i.test(v)) return {c:'bad', m:'Drop the scheme. The copy adds https:// itself, so this would send https://https://...'};
        if (/\s/.test(v)) return {c:'bad', m:'No spaces in a URL.'};
        if (!/^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}\/\S+$/i.test(v)) return {c:'bad', m:'Expected a domain and a path, like vitalstretchtc.co/wood.'};
        return {c:'ok', m:v.length+' characters'+(k==='link' ? ', charged in three separate texts. Twenty-five or fewer keeps them comfortable.' : '.')};
      case 'board': case 'venue':
        return /^\d{2,}$/.test(v) ? {c:'ok', m:'Composed into the booking destination below.'}
                                  : {c:'bad', m:'Digits only, copied out of the Momence booking URL.'};
      case 'place':
        return /^[A-Za-z0-9_-]{15,}$/.test(v) ? {c:'ok', m:'Composed into the review destination below.'}
                                              : {c:'bad', m:'A Place ID is one long unbroken string, usually starting ChIJ. This is not one.'};
      case 'lms':
        var t2 = gsmCheck(worst(fill(smsByName('Two hours before'), previewStudio())));
        return {c: t2.cost>160?'bad':'ok',
                m:'With this landmark the 2-hour text lands at '+t2.cost+' of 160 characters, '+t2.seg+' segment'+(t2.seg>1?'s':'')+'.'};
      case 'lml':
        return {c:'ok', m:'Email only, so nothing here is charged. Lower case, it continues a sentence.'};
      default:
        return {c:'ok', m:'Internal label.'};
    }
  }

  function ping(url, btn){

    out.textContent = 'Checking...';
    var settled = false;
    var timer = setTimeout(function(){
      if (settled) return; settled = true;
      out.className = 'imgnote bad';
      out.textContent = 'Nothing came back inside eight seconds. Usually a typo in the domain, or a short link that has not been created yet.';
    }, 8000);
    function fin(cls, msg){
      if (settled) return; settled = true; clearTimeout(timer);
      out.className = 'imgnote'+(cls?' '+cls:''); out.textContent = msg;
    }
    if (!window.fetch){ fin('', 'This browser cannot check it from here. Use Open instead.'); return; }
    fetch(url, {mode:'no-cors'}).then(function(){
      fin('', 'The host answered. That proves the domain resolves, nothing more: it cannot see where a redirect ends up or whether the page is the right studio. Open it once by hand.');
    }, function(){
